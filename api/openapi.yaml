    RequestCommand_edit_insert_bases:
      description: Puts bases in before `position` (the sequence's length appends them). Every later coordinate of the sequence moves on the tracks held in memory; the answer gives the sequence's new length, its first changed position and, for each track, the items shifted and set aside.
      examples:
        - { command: edit_insert_bases, params: { chromosome: chr1, position: 15000, bases: ACGTACGT } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: edit_insert_bases }
            params:
              type: object
              required: [chromosome, position, bases]
              properties:
                chromosome: { type: string }
                position:   { type: integer, minimum: 0 }
                bases:      { type: string, minLength: 1, maxLength: 10000000, pattern: "^[ACGTNRYKMSWBDHVacgtnrykmswbdhv]+$" }
              additionalProperties: false

    RequestCommand_edit_delete_bases:
      description: Takes the bases of [start, end) out (a sequence keeps one base at least).
      examples:
        - { command: edit_delete_bases, params: { chromosome: chr1, start: 20000, end: 20010 } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: edit_delete_bases }
            params:
              type: object
              required: [chromosome, start, end]
              properties:
                chromosome: { type: string }
                start:      { type: integer, minimum: 0 }
                end:        { type: integer, minimum: 1 }
              additionalProperties: false

    RequestCommand_edit_replace_bases:
      description: Replaces the bases of [start, end) by `bases`, of any length.
      examples:
        - { command: edit_replace_bases, params: { chromosome: chr1, start: 30000, end: 30003, bases: GGA } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: edit_replace_bases }
            params:
              type: object
              required: [chromosome, start, end, bases]
              properties:
                chromosome: { type: string }
                start:      { type: integer, minimum: 0 }
                end:        { type: integer, minimum: 1 }
                bases:      { type: string, minLength: 1, maxLength: 10000000, pattern: "^[ACGTNRYKMSWBDHVacgtnrykmswbdhv]+$" }
              additionalProperties: false

    RequestCommand_edit_undo:
      description: Undoes the last edits (the answer's `undone` lists them).
      examples:
        - { command: edit_undo, params: { steps: 2 } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: edit_undo }
            params:
              type: object
              properties:
                steps: { type: integer, minimum: 1, maximum: 1000, default: 1 }
              additionalProperties: false

    RequestCommand_edit_redo:
      description: Does again the edits undone last (the answer's `redone` lists them); a new edit after an undo drops the edits undone.
      examples:
        - { command: edit_redo, params: { steps: 1 } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: edit_redo }
            params:
              type: object
              properties:
                steps: { type: integer, minimum: 1, maximum: 1000, default: 1 }
              additionalProperties: false

    RequestCommand_edit_list:
      description: The active group's edit log (`operations`); answered at any time, an analysis or a load running.
      examples:
        - { command: edit_list }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: edit_list }
            params:
              type: object
              additionalProperties: false

    RequestCommand_edit_write:
      description: |
        Writes the edited reference as FASTA with its .fai, a gene track as
        GTF or GFF3 with its gene index (.gidx), and a feature track as BED
        (a feature with blocks as a BED12 line), each at the absolute path
        its key gives, in a folder that is there; a file that is there is
        refused unless `overwrite` is true. A write that fails is 500
        `WRITE_FAILED`. In a GFF3 each copy of a gene ID, and each of its
        transcripts, gets an ID of its own: @ and the chromosome
        (`gene:ATCG00150@ChrC`), and for copies on one chromosome also a
        colon and the copy's first base (`gene:ATMG01360@Chr2:3591778`);
        the GTF keeps the gene_id, and VX reads either file back as the
        same genes.
      examples:
        - { command: edit_write, params: { fasta: /tmp/edited.fa, annotation: /tmp/edited.gff3, overwrite: true } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: edit_write }
            params:
              type: object
              properties:
                fasta:         { type: string }
                annotation:    { type: string }
                features:      { type: string }
                track:         { type: string, description: "The gene track to write (with annotation); default, the one the edits changed, else the group's one gene track held in memory." }
                feature_track: { type: string, description: "The feature track to write (with features); default, the one the edits changed." }
                format:        { type: string, enum: [gtf, gff3], description: "With annotation; default, by its extension (.gtf; .gff3 or .gff)." }
                overwrite:     { type: boolean, default: false }
              additionalProperties: false

    RequestCommand_edit_discard:
      description: Drops every edit of the active group and gives the original reference back; the answer gives `discarded`.
      examples:
        - { command: edit_discard }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: edit_discard }
            params:
              type: object
              additionalProperties: false

    # Circular view and dot plot (since 0.11.0)
    RequestCommand_open_circular_view:
      description: |
        Since 0.11.0. Opens the circular view of a sequence of up to
        20,000,000 bases in its window, with the rings named or the first
        ten that have something on the sequence. A viewer without a window
        answers 409 `INVALID_STATE`; a longer sequence 400 `INVALID_PARAMS`;
        a name the reference lacks 404 `CHROMOSOME_NOT_FOUND`. The answer
        gives the view's state (`view`).
      examples:
        - { command: open_circular_view, params: { sequence: chrM, chords: true } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: open_circular_view }
            params:
              type: object
              properties:
                sequence: { type: string, description: "Default: the chromosome in view." }
                rings:    { type: array, items: { type: string }, description: "Track names or ring titles." }
                labels:   { type: boolean }
                ruler:    { type: boolean }
                chords:   { type: boolean }
                legend:   { type: boolean }
              patternProperties:
                "^_": {}
              additionalProperties: false

    RequestCommand_export_circular_view:
      description: Since 0.11.0. Writes the circular view as SVG or PNG, with a window or without; the answer comes when the file is written.
      examples:
        - { command: export_circular_view, params: { path: /tmp/chrM.svg, sequence: chrM, width: 1200, height: 900 } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: export_circular_view }
            params:
              type: object
              required: [path]
              properties:
                path:     { type: string, pattern: "\\.([sS][vV][gG]|[pP][nN][gG])$", description: "A file ending in .svg or .png." }
                sequence: { type: string, description: "Default: the window's sequence, else the chromosome in view." }
                rings:    { type: array, items: { type: string } }
                labels:   { type: boolean }
                ruler:    { type: boolean }
                chords:   { type: boolean }
                legend:   { type: boolean }
                width:    { type: number, minimum: 200, maximum: 8000, default: 1200, description: "Logical pixels." }
                height:   { type: number, minimum: 200, maximum: 8000, default: 900 }
                scale:    { type: number, minimum: 0.25, maximum: 8, default: 1, description: "A PNG's pixels a logical pixel." }
              patternProperties:
                "^_": {}
              additionalProperties: false

    RequestCommand_dot_plot:
      description: |
        Since 0.11.0. Writes a dot plot of exact word matches as SVG or PNG:
        a region against itself (`x`), against another (`x` and `y`), or a
        transcript against its gene's region (`transcript`). A side longer
        than 2,000,000 bases is refused; up to 100,000 bases a side and
        2,000,000 matches the matches are drawn as runs, beyond that they
        are counted in at most 1,000 by 1,000 cells (`binned`). The answer
        comes when the file is written. With `open`, the dot plot's dialog
        shows it too (not without a window).
      examples:
        - { command: dot_plot, params: { x: "chr1:100000-140000", word: 12, path: /tmp/self.png } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: dot_plot }
            params:
              type: object
              required: [path]
              properties:
                x:          { type: string, description: "chromosome:start-end (0-based, end excluded), or a sequence's name; needed unless transcript is given." }
                y:          { type: string }
                transcript: { type: string }
                word:       { type: integer, minimum: 4, maximum: 31, default: 12 }
                path:       { type: string, pattern: "\\.([sS][vV][gG]|[pP][nN][gG])$" }
                width:      { type: number, minimum: 200, maximum: 8000, default: 900 }
                height:     { type: number, minimum: 200, maximum: 8000, default: 900 }
                scale:      { type: number, minimum: 0.25, maximum: 8, default: 1 }
                open:       { type: boolean }
              patternProperties:
                "^_": {}
              additionalProperties: false

    # ── Selected response schemas (illustrative; many more exist) ──
    Response_navigate:
      type: object
      properties:
        success:    { type: boolean }
        chromosome: { type: string, description: "As the loaded reference names it." }
        start:      { type: integer }
        end:        { type: integer }

    Response_zoom:
      type: object
      properties:
        success:    { type: boolean }
        viewStart:  { type: integer }
        viewEnd:    { type: integer }
        viewLength: { type: integer }

    Response_set_reference_mode:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        group:   { type: string }
        mode:    { type: string, enum: [auto, genome, transcriptome] }
        kind:    { type: string, enum: [none, genome, transcriptome], description: "What the reference is read as." }
        why:     { type: string }

    Response_next_coverage_region:
      type: object
      properties:
        success:     { type: boolean }
        moved:       { type: boolean }
        direction:   { type: string, enum: [next, prev] }
        chromosome:  { type: string }
        viewStart:   { type: integer }
        viewEnd:     { type: integer }
        targetStart: { type: integer, description: "When the view moved." }
        targetEnd:   { type: integer, description: "When the view moved." }
        track:       { type: string, description: "The track scanned." }
        trackType:   { type: string }
        scanned:     { type: boolean, description: "False when no track has coverage to scan." }
        scanSeconds: { type: number }
        cancelled:   { type: boolean }
        cancelledBy: { type: string, enum: [api, panel] }
        note:        { type: string }

    Response_cancel_coverage_scan:
      type: object
      properties:
        success:    { type: boolean }
        message:    { type: string }
        cancelled:  { type: boolean }
        track:      { type: string }
        chromosome: { type: string }

    Response_get_sequence:
      type: object
      properties:
        chromosome: { type: string }
        start:      { type: integer }
        end:        { type: integer }
        length:     { type: integer }
        sequence:   { type: string, description: "DNA letters (A/C/G/T/N), uppercase. Up to 100,000 bases per request." }

    Response_get_genes:
      type: object
      properties:
        chromosome: { type: string }
        start:      { type: integer }
        end:        { type: integer }
        count:      { type: integer }
        genes:
          type: array
          items:
            type: object
            properties:
              geneId:     { type: string }
              geneName:   { type: string, description: "The annotation's name." }
              displayName: { type: string, description: "The name the screens show (since 0.11.0): the annotation's, with the chromosome in brackets for an ID that other chromosomes carry too (\"ATCG00150 (ChrC)\"), or with the chromosome and the first base (1-based) for one of the copies of an ID on one chromosome (\"ATMG01360 (Chr2:3,591,778)\")." }
              biotype:    { type: string }
              chromosome: { type: string }
              start:      { type: integer }
              end:        { type: integer }
              strand:     { type: string, enum: ["+", "-", "."] }
              transcripts:
                type: array
                items:
                  type: object
                  properties:
                    transcriptId:   { type: string }
                    transcriptName: { type: string }
                    start:          { type: integer }
                    end:            { type: integer }
                    exonCount:      { type: integer }
                    exons:
                      type: array
                      items: { $ref: "#/components/schemas/Span" }
                    translonRegionCount: { type: integer }
                    translonRegions:
                      type: array
                      description: The translated region (the annotation's CDS).
                      items: { $ref: "#/components/schemas/Span" }
                    utrCount: { type: integer }
                    utr:
                      type: array
                      items: { $ref: "#/components/schemas/Span" }

    Span:
      type: object
      properties:
        start: { type: integer }
        end:   { type: integer }

    Response_search_genes:
      type: object
      properties:
        query:   { type: string }
        count:   { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              geneId:     { type: string }
              geneName:   { type: string, description: "The annotation's name (its ID where it has none)." }
              displayName: { type: string, description: "The name the screens show (since 0.11.0): the annotation's, with the chromosome in brackets for an ID that other chromosomes carry too (\"ATCG00150 (ChrC)\"), or with the chromosome and the first base (1-based) for one of the copies of an ID on one chromosome (\"ATMG01360 (Chr2:3,591,778)\")." }
              biotype:    { type: string, description: "An annotation held in memory." }
              chromosome: { type: string }
              start:      { type: integer }
              end:        { type: integer }
              strand:     { type: string, enum: ["+", "-", "."], description: "An annotation held in memory." }
              description: { type: string, description: "An annotation read through its gene index, when the gene has one." }

    Response_click_element:
      type: object
      properties:
        hit:              { type: boolean, description: "Whether an element was under the point." }
        selectedElements: { type: integer }
        popupVisible:     { type: boolean }
        popupText:        { type: string, description: "When the popup is open." }
        rightClick:       { type: string, enum: [inform, menu], description: "With button 3: inform (the popup) or menu (the mouse would open the context menu)." }
        selected:
          type: object
          description: When exactly one element is selected.
          properties:
            trackName:    { type: string }
            trackType:    { type: string }
            elementIndex: { type: integer }
            subIndex:     { type: integer, description: "A modification call's index, -1 for the element itself." }

    Response_export_region:
      type: object
      properties:
        success:    { type: boolean }
        path:       { type: string }
        format:     { type: string, enum: [fasta, gff] }
        chromosome: { type: string }
        start:      { type: integer }
        end:        { type: integer }

    Response_export_image:
      type: object
      properties:
        success:     { type: boolean }
        path:        { type: string }
        format:      { type: string, enum: [png, jpeg, tiff] }
        width:       { type: integer }
        height:      { type: integer }
        scale:       { type: number }
        clamped:     { type: boolean, description: "The scale was lowered to what the GPU can render." }
        transparent: { type: boolean, description: "The file has an alpha channel." }

    Response_list_chromosomes:
      type: object
      properties:
        count:       { type: integer }
        totalLength: { type: integer }
        chromosomes:
          type: array
          items:
            type: object
            properties:
              name:   { type: string }
              length: { type: integer }

    Response_add_bookmark:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        group:   { type: string, description: "The bookmark's group; an empty text for every group (since 0.11.0)." }

    Response_list_bookmarks:
      type: object
      properties:
        count: { type: integer }
        bookmarks:
          type: array
          items:
            type: object
            properties:
              index:  { type: integer }
              label:  { type: string }
              region: { type: string, description: "'chr:start-end' format (0-based start, end exclusive)." }
              group:  { type: string, description: "Since 0.11.0; an empty text for every group." }
        activeGroup: { type: string, description: "Since 0.11.0." }
        view:        { type: string, enum: [all, group], description: "Since 0.11.0." }

    Response_goto_bookmark:
      type: object
      properties:
        success:  { type: boolean }
        message:  { type: string }
        group:    { type: string, description: "The group gone to (since 0.11.0)." }
        switched: { type: boolean, description: "Whether the active group changed (since 0.11.0)." }

    Response_track_options:
      type: object
      description: The answer of set_coverage_options, set_sequence_options, set_gene_options, set_feature_options, set_sashimi_options, set_overlay_options and set_aggregate_options (each with `options`), set_track_options (with `style`), set_interaction_options (with `interaction` and `matrix`), set_dti_options (with `dti`) and set_alignment_options (with `options` and, when a strip was opened, `opened_track`).
      properties:
        success:      { type: boolean }
        message:      { type: string }
        options:      { type: object }
        style:        { type: object }
        interaction:  { type: object }
        matrix:       { type: [object, "null"] }
        dti:          { type: object }
        opened_track: { type: string }
        warning:      { type: string, description: "A variant summary's: min_alt_per_strand set on RNA reads." }

    Response_add_track:
      type: object
      description: The answer of add_aggregate_track, add_sashimi_track and add_overlay_track.
      properties:
        success: { type: boolean }
        message: { type: string }
        name:    { type: string, description: "The new track's name." }
        group:   { type: string }
        options: { type: object }
        warning: { type: string }

    Response_aggregate_rows:
      type: object
      properties:
        success:    { type: boolean }
        name:       { type: string }
        chromosome: { type: string }
        bam_chromosome: { type: string, description: "The BAM's name for it." }
        start:      { type: integer }
        end:        { type: integer }
        max_span:   { type: integer }
        options:    { type: object }
        rows:       { type: array, items: { type: object }, description: "Without path." }
        path:       { type: string, description: "With path." }
        format:     { type: string, enum: [tsv, bedmethyl] }
        rows_written: { type: integer }
        resolution: { type: string, description: "A modification density's." }
        tested:     { type: integer }
        q_over:     { type: string, description: "A variant summary's: the sites and region its q is over." }
        test:       { type: string, description: "A modification density's: binomial or fisher. A variant summary's: the test in words." }
        sites_untested: { type: integer, description: "A variant summary's: the sites listed and not tested (Fisher's test where the control has no read)." }
        strand_filtered: { type: integer, description: "A variant summary's: the sites the strand rule left out." }
        strand_unjudged: { type: integer, description: "A variant summary's, since 0.11.0: the sites listed that the strand rule could not judge (their main change under min_alt_per_strand reads on a strand, and their reference base too)." }
        strand_rule: { type: string, description: "A variant summary's: the strand rule and what it did, in words; empty with the rule off." }
        control:    { type: object, description: "A variant summary's: the control's name and bam, whether it was counted, its records, and why not (problem)." }

    Response_loading_status:
      type: object
      properties:
        isLoading:    { type: boolean }
        progress:     { type: number, minimum: 0, maximum: 1 }
        stage:        { type: string }
        done:         { type: boolean }
        finalizing:   { type: boolean, description: "A finished load whose track is not yet in the viewer." }
        queued:       { type: integer, description: "Loads waiting behind this one." }
        hasError:     { type: boolean }
        cancelled:    { type: boolean, description: "The load that ended last was cancelled (hasError is true too)." }
        errorMessage: { type: string }
        filename:     { type: string }
        demo:         { type: object, description: "While or after a demo case is opened: the job (case, phase, bytes, files, error)." }

    Response_list_analyses:
      type: object
      properties:
        analyses:
          type: array
          items:
            type: object
            properties:
              name:           { type: string }
              type:           { type: string }
              description:    { type: string }
              category:       { type: string }
              output_format:  { type: string }
              needs_sequence: { type: boolean }
              reads_sequence: { type: boolean }
              inputs:         { type: array, items: { type: object } }
        left_out_for_genome:
          type: array
          description: Since 0.11.0, on a group whose reference is read as a transcriptome, the analyses meant for a genome that `analyses` leaves out; an empty list on any other group.
          items:
            type: object
            properties:
              name:   { type: string }
              type:   { type: string, description: "The name run_analysis takes." }
              reason: { type: string }
        track_count:  { type: integer }
        has_sequence: { type: boolean }

    Response_run_analysis:
      type: object
      properties:
        status:      { type: string, enum: [running] }
        analysis:    { type: string }
        output_path: { type: string, description: "When output_path was given, as resolved." }

    Response_analysis_status:
      type: object
      properties:
        running:    { type: boolean }
        stage:      { type: string }
        progress:   { type: number, minimum: 0, maximum: 1 }
        complete:   { type: boolean, description: "True only once the analysis has ended, with running false and its result." }
        cancelled:  { type: boolean, description: "False for an analysis that succeeded." }
        elapsed_seconds: { type: number }
        estimated_remaining_seconds: { type: number }
        success:        { type: boolean }
        error:          { type: string }
        output_path:    { type: string }
        summary:        { type: object, description: "The analysis's counts; summary.manifest names the manifest." }
        parameters:     { type: object, description: "Every parameter the analysis read, as applied." }
        parameters_unread: { type: array, items: { type: string }, description: "Since 0.11.0: the parameters the request gave that the analysis did not read." }
        scope_applied:  { type: string }
        region_applied:
          type: object
          properties:
            chromosome: { type: string }
            start:      { type: integer }
            end:        { type: integer }

    Response_read_result_rows:
      type: object
      properties:
        path:        { type: string }
        header:
          type: array
          items: { type: string }
          description: A table's column names, a VCF's #CHROM names; empty for a BED or bedGraph.
        rows:
          type: array
          items:
            type: array
            items: { type: string }
          description: Each line split on tabs; lines starting with '#', blank lines and a track line are not rows.
        offset:      { type: integer }
        returned:    { type: integer }
        next_offset: { type: integer, description: "Only when more rows follow." }
        bytes:       { type: integer, description: "The file's size." }
        bytes_read:  { type: integer }
        cut_rows:
          type: array
          items: { type: integer }
          description: The rows longer than 64 KiB, given cut; only when there are any.

    Response_recording_status:
      type: object
      properties:
        ffmpeg_available: { type: boolean }
        recording:        { type: boolean }
        elapsed:          { type: string, description: "MM:SS while recording." }
        frames:           { type: integer }

    Response_save_session:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        path:    { type: string }

    Response_load_session:
      type: object
      properties:
        success:         { type: boolean }
        message:         { type: string }
        results_reused:
          type: array
          items: { type: string }
        results_missing:
          type: array
          items: { type: string }
        inputs_missing:
          type: array
          items:
            type: object
            properties:
              path:  { type: string }
              group: { type: string }
              track: { type: string }
        restore_skipped:
          type: array
          items: { $ref: "#/components/schemas/RestoreSkipped" }
        status: { type: string }

    Response_load_demo:
      type: object
      description: A demo case's answer (case 1, 2, 3a, 3b or 4), or, for case builtin (since 0.11.0), the making of the built-in demo (dir, written, reasons, files, bytes, millis, fallback, groups, navigate, made).
      properties:
        success:        { type: boolean }
        message:        { type: string }
        case:           { type: string }
        title:          { type: string }
        zip:            { type: string }
        url:            { type: string }
        zip_bytes:      { type: integer }
        unpacked_bytes: { type: integer }
        state:          { type: string, description: "The case's state in the cache." }
        dir:            { type: string }
        load_order:
          type: array
          items: { type: string }
        view:           { type: string }
        navigate:       { type: boolean }
        written:        { type: boolean, description: "builtin: whether the demo's files were written now." }
        reasons:        { type: array, items: { type: string } }
        files:          { type: integer }
        bytes:          { type: integer }
        millis:         { type: number }
        fallback:       { type: boolean, description: "builtin: made in memory, its files could not be written." }
        groups:         { type: array, items: { type: string } }
        made:           { type: boolean, description: "builtin: false when the demo's two groups were kept as they were." }

    Response_demo_status:
      type: object
      properties:
        base_url:          { type: string }
        base_url_source:   { type: string, enum: [environment, settings, default] }
        base_url_problem:  { type: string }
        cache_dir:         { type: string }
        cases:
          type: array
          items:
            type: object
            properties:
              case:           { type: string }
              title:          { type: string }
              summary:        { type: string }
              study:          { type: string }
              quick_start:    { type: boolean }
              zip:            { type: string }
              zip_bytes:      { type: integer }
              unpacked_bytes: { type: integer }
              state:          { type: string }
              view:           { type: string }
              load_order:
                type: array
                items: { type: string }
        job:
          type: [object, "null"]
          description: The last demo job, or null.

    Response_known_features:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        tab:     { type: string, description: "The tab's key." }
        opened:  { type: boolean }
        state:   { type: string, enum: [queued, fetching, done, cancelled] }

    Response_edit:
      type: object
      description: The answer of an edit command (since 0.11.0).
      properties:
        success:     { type: boolean }
        log:
          type: object
          properties:
            length:   { type: integer }
            position: { type: integer, description: "Where Undo stands." }
        operation:   { type: integer, description: "The edit's index in the log." }
        description: { type: string, description: "The log's line." }
        gene:        { type: object, description: "The gene as it is now." }
        feature:     { type: object, description: "The feature as it is now." }
        sequence:
          type: object
          description: After a base edit.
          properties:
            name:          { type: string }
            length:        { type: integer }
            first_changed: { type: [integer, "null"] }
        tracks:
          type: array
          description: After a base edit, each track's items shifted and set aside.
          items:
            type: object
            properties:
              track:   { type: string }
              shifted: { type: integer }
              dropped: { type: integer }
        operations: { type: array, items: { type: object }, description: "edit_list." }
        undone:     { type: array, items: { type: string } }
        redone:     { type: array, items: { type: string } }
        discarded:  { type: integer }
        fasta:      { type: string, description: "edit_write: the files written, with their counts." }
        fai:        { type: string }
        annotation: { type: string }
        index:      { type: string }
        features:   { type: string }

    Response_export_circular_view:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        path:    { type: string }
        format:  { type: string, enum: [svg, png] }
        width:   { type: number }
        height:  { type: number }
        scale:   { type: number }
        view:    { type: object, description: "The sequence, its rings and chords." }

    Response_dot_plot:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        path:    { type: string }
        format:  { type: string, enum: [svg, png] }
        title:   { type: string }
        x:       { type: object, description: "name, chromosome, start, end, length, transcript." }
        y:       { type: object }
        word:    { type: integer }
        binned:  { type: boolean }
        forwardMatches: { type: integer }
        reverseMatches: { type: integer }
        runs:    { type: integer }
        opened:  { type: boolean }
