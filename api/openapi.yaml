                  edit_insert_bases: "#/components/schemas/RequestCommand_edit_insert_bases"
                  edit_delete_bases: "#/components/schemas/RequestCommand_edit_delete_bases"
                  edit_replace_bases: "#/components/schemas/RequestCommand_edit_replace_bases"
                  edit_undo: "#/components/schemas/RequestCommand_edit_undo"
                  edit_redo: "#/components/schemas/RequestCommand_edit_redo"
                  edit_list: "#/components/schemas/RequestCommand_edit_list"
                  edit_write: "#/components/schemas/RequestCommand_edit_write"
                  edit_discard: "#/components/schemas/RequestCommand_edit_discard"
                  open_circular_view: "#/components/schemas/RequestCommand_open_circular_view"
                  export_circular_view: "#/components/schemas/RequestCommand_export_circular_view"
                  dot_plot: "#/components/schemas/RequestCommand_dot_plot"
      responses:
        "200":
          description: |
            Command-specific JSON response. Schemas vary per command: see
            the matching `Response_<command>` schema in `#/components` for
            common patterns. A failure carries the HTTP status of its `code`
            (below) with a JSON body holding `error` and `code`.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - $ref: "#/components/schemas/Response_navigate"
                  - $ref: "#/components/schemas/Response_zoom"
                  - $ref: "#/components/schemas/Response_set_reference_mode"
                  - $ref: "#/components/schemas/Response_next_coverage_region"
                  - $ref: "#/components/schemas/Response_cancel_coverage_scan"
                  - $ref: "#/components/schemas/Response_get_sequence"
                  - $ref: "#/components/schemas/Response_get_genes"
                  - $ref: "#/components/schemas/Response_search_genes"
                  - $ref: "#/components/schemas/Response_click_element"
                  - $ref: "#/components/schemas/Response_export_region"
                  - $ref: "#/components/schemas/Response_export_image"
                  - $ref: "#/components/schemas/Response_list_chromosomes"
                  - $ref: "#/components/schemas/Response_add_bookmark"
                  - $ref: "#/components/schemas/Response_list_bookmarks"
                  - $ref: "#/components/schemas/Response_goto_bookmark"
                  - $ref: "#/components/schemas/Response_loading_status"
                  - $ref: "#/components/schemas/Response_track_options"
                  - $ref: "#/components/schemas/Response_add_track"
                  - $ref: "#/components/schemas/Response_aggregate_rows"
                  - $ref: "#/components/schemas/Response_list_analyses"
                  - $ref: "#/components/schemas/Response_run_analysis"
                  - $ref: "#/components/schemas/Response_analysis_status"
                  - $ref: "#/components/schemas/Response_read_result_rows"
                  - $ref: "#/components/schemas/Response_recording_status"
                  - $ref: "#/components/schemas/Response_save_session"
                  - $ref: "#/components/schemas/Response_load_session"
                  - $ref: "#/components/schemas/Response_load_demo"
                  - $ref: "#/components/schemas/Response_demo_status"
                  - $ref: "#/components/schemas/Response_known_features"
                  - $ref: "#/components/schemas/Response_edit"
                  - $ref: "#/components/schemas/Response_export_circular_view"
                  - $ref: "#/components/schemas/Response_dot_plot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/NotReady"
        "504":
          $ref: "#/components/responses/Timeout"

components:
  parameters:
    ScaleQuery:
      in: query
      name: scale
      required: false
      schema:
        type: number
        minimum: 0.25
        maximum: 8.0
        default: 1.0
      description: |
        Resolution scale factor, from 0.25 to 8. 1.0 = screen resolution.
        A scale outside that range (or text that is not a number) is
        refused with 400 `INVALID_PARAMS`, naming it.

  responses:
    BadRequest:
      description: "A request the client can mend (INVALID_PARAMS, PARSE_ERROR, UNKNOWN_ANALYSIS, NOT_SUPPORTED)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: "Required: chromosome, start, end (end > start)"
            code: INVALID_PARAMS
    Forbidden:
      description: "A request sent by a page in a web browser (FORBIDDEN_ORIGIN, any path), or a path read_result_rows does not read (NOT_A_RESULT)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: "Refused: the request carries an Origin header (http://example.org). The API takes requests from programs on this computer, not from pages in a web browser"
            code: FORBIDDEN_ORIGIN
    NotFound:
      description: "A name that is not there (UNKNOWN_COMMAND, UNKNOWN_ENDPOINT, NOT_FOUND, or a code ending in _NOT_FOUND)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: "Track not found: reads.bam"
            code: NOT_FOUND
    Conflict:
      description: "A state the request conflicts with (BUSY, LOADING, INVALID_STATE, NO_REFERENCE, NO_ANNOTATION)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: "An analysis is already running"
            code: INVALID_STATE
    ServerError:
      description: "The operation was attempted and failed (OPERATION_FAILED, IO_ERROR, WRITE_FAILED, DEPENDENCY_MISSING, INTERNAL_ERROR, or no code)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: "ffmpeg not found"
            code: DEPENDENCY_MISSING
    NotImplemented:
      description: "Not implemented in this version (NOT_IMPLEMENTED)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotReady:
      description: "The viewer cannot serve it now (NOT_READY, NO_RENDER): still starting, nothing loaded, no OpenGL context for a capture."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: "Application not ready: callbacks not yet registered"
            code: NOT_READY
    Timeout:
      description: "The window did not answer in time (TIMEOUT; the request may still be carried out), or a coverage scan read nothing for 60 s (STALLED)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    # ── Core envelopes ─────────────────────────────────────────────
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: The codes VX sends; the HTTP status follows the code.
          enum:
            - INVALID_PARAMS
            - PARSE_ERROR
            - UNKNOWN_ANALYSIS
            - NOT_SUPPORTED
            - NOT_A_RESULT
            - FORBIDDEN_ORIGIN
            - UNKNOWN_COMMAND
            - UNKNOWN_ENDPOINT
            - NOT_FOUND
            - TRACK_NOT_FOUND
            - FEATURE_NOT_FOUND
            - CHROMOSOME_NOT_FOUND
            - GENE_NOT_FOUND
            - TAB_NOT_FOUND
            - METHOD_NOT_ALLOWED
            - BUSY
            - LOADING
            - INVALID_STATE
            - NO_REFERENCE
            - NO_ANNOTATION
            - NOT_IMPLEMENTED
            - NOT_READY
            - NO_RENDER
            - TIMEOUT
            - STALLED
            - OPERATION_FAILED
            - IO_ERROR
            - WRITE_FAILED
            - DEPENDENCY_MISSING
            - INTERNAL_ERROR
        details:
          type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

    PingResponse:
      type: object
      required: [status, app, api_version]
      properties:
        status: { type: string, enum: [ok] }
        app:    { type: string }
        api_version: { type: integer }

    # ── Shared value shapes ────────────────────────────────────────
    Colour:
      type: array
      description: "[r, g, b], each a whole number from 0 to 255."
      minItems: 3
      maxItems: 3
      items: { type: integer, minimum: 0, maximum: 255 }

    AxisScale:
      type: string
      description: The value axis's transform (log2 and log10 of 1 + the value).
      enum: [linear, log2, log10, sqrt, asinh]

    AxisBound:
      type: number
      minimum: -1000000000
      maximum: 1000000000
      description: An end of the manual range drawn while auto_scale is false. A range whose top is not above its bottom is refused by name.

    StateResponse:
      type: object
      properties:
        chromosome: { type: string }
        viewStart:  { type: integer }
        viewEnd:    { type: integer }
        viewLength: { type: integer }
        zoomLevel:  { type: number }
        hasDemoData: { type: boolean }
        hasReferenceGenome: { type: boolean }
        currentReferenceFile: { type: string }
        activeGroup: { type: string }
        activeGroupType: { type: string }
        trackCount: { type: integer }
        visibleTrackCount: { type: integer }
        hasReference: { type: boolean }
        reference:
          type: string
          description: The active group's reference file, or "No reference" (since 0.11.0; each group in `groups` has it too).
        referenceMode: { type: string, enum: [auto, genome, transcriptome], description: "Since 0.11.0." }
        referenceKind: { type: string, enum: [none, genome, transcriptome], description: "What the reference is read as (since 0.11.0)." }
        referenceWhy: { type: string, description: "Why it is read so (since 0.11.0)." }
        cytobandChromosomes: { type: integer, description: "The chromosomes the group's band table covers; 0 for none yet (since 0.11.0)." }
        currentChromosomeLength: { type: integer }
        tracks:
          type: array
          items:
            type: object
            description: |
              Every track has name, type, visible, height and, since 0.11.0,
              `selected`, `style` (the keys of set_track_options) and
              `options` (the keys of its type's set command; null for a type
              whose options are under a key of their own). A track of a
              given kind also has its own entry: an interaction track
              `interaction` (opacity, customOpacity), `matrix` (the Matrix
              display) and, once TAD Boundary Detection ran on it,
              `tadBoundaries`; a signal track `signal` (source, window); a
              result track `result` (analysis, analysisName, file, manifest,
              parameters, note); a feature track `feature` (with capListed,
              capHeld and capNoun); an alignment track `readLayout`,
              `totalMappedReads`, `coverageReadTo`, `indegra`, `strips` and
              `callsMatrix`; a read aggregate track `aggregate` (and a variant
              summary `variants`); a Sashimi track `sashimi`; an overlay
              `overlay`; a DTI track `dti`. Each quantitative track has `axis`,
              the axis the last frame drew (null before one), and an alignment
              track `coverageAxis` for its coverage strip.
            properties:
              name:    { type: string }
              type:    { type: string }
              visible: { type: boolean }
              height:  { type: number }
              selected: { type: boolean }
              style: { type: object }
              options: { type: [object, "null"] }
              interaction: { type: object }
              matrix: { type: [object, "null"] }
              tadBoundaries: { type: object }
              signal: { type: [object, "null"] }
              result: { type: object }
              feature: { type: object }
              readLayout: { type: object }
              totalMappedReads: { type: integer }
              coverageReadTo:
                type: [integer, "null"]
                description: The last base (1-based) whose depth the coverage strip read whole, when the view held more records than the read budget; null when the window was read whole.
              indegra: { type: object }
              strips: { type: array, items: { type: object } }
              callsMatrix: { type: [object, "null"] }
              aggregate: { type: object }
              variants: { type: object }
              sashimi: { type: object }
              overlay: { type: object }
              dti: { type: object }
              axis: { type: [object, "null"] }
              coverageAxis: { type: [object, "null"] }
        chromosomes:
          type: array
          items:
            type: object
            properties:
              name:   { type: string }
              length: { type: integer }
        groups:
          type: array
          items:
            type: object
            properties:
              name:        { type: string }
              displayName: { type: string }
              type:        { type: string }
              isActive:    { type: boolean }
              trackCount:  { type: integer }
              hasReference: { type: boolean }
              reference:   { type: string }
              referenceMode: { type: string }
              referenceKind: { type: string }
              referenceWhy: { type: string }
              cytobandChromosomes: { type: integer }
        bookmarkView: { type: string, enum: [all, group], description: "What the left panel's bookmark list shows (since 0.11.0)." }
        magnifierLocked: { type: boolean, description: "Two quick presses of Alt keep the magnifier on (since 0.11.0)." }
        edit: { type: object, description: "The active group's edit log: operations, position, can_undo, can_redo, edited_sequences, edited_tracks (since 0.11.0)." }
        knownFeatures: { type: [object, "null"], description: "The Known Features pane: options, shown, tabs, active (since 0.11.0)." }
        circularView: { type: [object, "null"], description: "The circular view while its window is open (since 0.11.0)." }
        dotPlot: { type: [object, "null"], description: "The dot plot while its dialog is open (since 0.11.0)." }
        config:
          type: object
          properties:
            interfaceScale: { type: number }
            fontScale:      { type: number }
            showGrid:       { type: boolean }
            showLabels:     { type: boolean }
            darkMode:       { type: boolean }
            trackHeight:    { type: number, description: "The height set_config trackHeight gave for this run; 0 for none." }
            activeModeEnabled: { type: boolean }
            geneDetailView: { type: boolean }
            intronCollapseEnabled: { type: boolean }
        windowWidth:  { type: integer }
        windowHeight: { type: integer }
        viewportWidth:  { type: integer, description: "The track area's width in logical pixels." }
        viewportHeight: { type: integer, description: "The track area's height in logical pixels." }
        scaleFactor:    { type: number }
        headless:       { type: boolean, description: "The viewer runs without a window." }
        sessionRestoring:
          type: boolean
          description: A restore is still applying its tracks' settings; wait for false before reading them.
        results_reused:
          type: array
          items: { type: string }
          description: After a session load, the result files loaded again as their tracks.
        results_missing:
          type: array
          items: { type: string }
          description: After a session load, the result files that were not there.
        results_status:
          type: string
          description: The restore's status line, naming what it did not make and why.
        restore_skipped:
          type: array
          description: Each part of the session the restore did not make.
          items:
            $ref: "#/components/schemas/RestoreSkipped"

    RestoreSkipped:
      type: object
      properties:
        group:  { type: string }
        track:  { type: string }
        reason: { type: string }

    # ── /navigate request body ─────────────────────────────────────
    NavigateLegacyRequest:
      type: object
      required: [chromosome, start, end]
      properties:
        chromosome: { type: string, example: "chr1" }
        start:     { type: integer, minimum: 0, example: 1000000 }
        end:       { type: integer, minimum: 1, example: 1500000 }

    # ── Generic /command envelope ─────────────────────────────────
    CommandEnvelope:
      type: object
      required: [command]
      properties:
        command:
          type: string
        params:
          type: object

    # ── Per-command request schemas ───────────────────────────────
    # File loading
    RequestCommand_load_file:
      description: |
        Loads a file, its type by its extension (a `.gz` or `.bgz` file by
        the extension before it). The answer is "Loading <kind>: <name>"
        when the load starts now, or "Queued: <name> (position N)" with
        `queued` true and `position` when it waits behind another load.
        A file that is not there answers 404 `NOT_FOUND`; a `.bam` that is
        not BGZF, or is cut short, is refused with the reason. Since 0.11.0
        a `.cool`, `.mcool` or `.hic` file is refused with 400
        `NOT_SUPPORTED`, the answer saying to write the contacts as BEDPE.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: load_file }
            params:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: Absolute path to a FASTA / GTF / GFF / BAM / SAM / VCF / BED / bedGraph / Wiggle / BigWig / BigBed / BEDPE file, an INDEGRA process table, or a .vxs session.

    # Track management
    RequestCommand_set_track_visibility:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: set_track_visibility }
            params:
              type: object
              required: [name, visible]
              properties:
                name:    { type: string }
                visible: { type: boolean }

    RequestCommand_set_track_height:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: set_track_height }
            params:
              type: object
              required: [name, height]
              properties:
                name:   { type: string }
                height: { type: number, minimum: 10 }

    RequestCommand_set_track_scroll:
      description: Scrolls a track's rows as the mouse wheel does. Since 0.11.0 the rows of a gene, feature or transcript DTI track as well as an alignment track's reads; another kind of track answers 400 NOT_SUPPORTED.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: set_track_scroll }
            params:
              type: object
              required: [name, offset]
              properties:
                name:   { type: string, description: "An alignment, gene, feature or transcript DTI track's name." }
                offset: { type: number, description: "Pixels from the top of the rows; a negative value is read as 0." }

    RequestCommand_remove_track:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: remove_track }
            params:
              type: object
              required: [name]
              properties:
                name: { type: string }

    RequestCommand_reorder_track:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: reorder_track }
            params:
              type: object
              required: [name, position]
              properties:
                name:     { type: string }
                position: { type: integer, minimum: 0 }

    # Group management
    RequestCommand_create_group:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: create_group }
            params:
              type: object
              required: [name]
              properties:
                name: { type: string }

    RequestCommand_switch_group:
      description: Makes the group active and shows its first sequence, as the left panel's group selector does.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: switch_group }
            params:
              type: object
              required: [name]
              properties:
                name: { type: string }

    RequestCommand_remove_group:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: remove_group }
            params:
              type: object
              required: [name]
              properties:
                name: { type: string }

    RequestCommand_set_reference_mode:
      description: |
        Since 0.11.0. Sets how a group's reference is read: `auto` (by the
        sequences' names and lengths), `genome` or `transcriptome`. The
        answer gives `group`, `mode`, `kind` (what the reference is now
        read as) and `why`. Another word is 400 `INVALID_PARAMS`, a group
        that is not there 404 `NOT_FOUND`, a group without a reference 409
        `NO_REFERENCE`.
      examples:
        - { command: set_reference_mode, params: { mode: transcriptome } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: set_reference_mode }
            params:
              type: object
              required: [mode]
              properties:
                mode:  { type: string, enum: [auto, genome, transcriptome], description: "Read whatever its letter case." }
                group: { type: string, description: "The group's name; default, the active group." }

    # Navigation
    RequestCommand_navigate:
      description: The chromosome may be any alias of the reference's name (chr1, 1); one that is not in the loaded reference answers 404 NOT_FOUND.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: navigate }
            params:
              type: object
              required: [chromosome, start, end]
              properties:
                chromosome: { type: string }
                start:      { type: integer, minimum: 0 }
                end:        { type: integer, minimum: 1, description: "Exclusive; must be greater than start." }

    RequestCommand_zoom:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: zoom }
            params:
              type: object
              required: [factor]
              properties:
                factor:
                  type: number
                  exclusiveMinimum: 0
                  description: ">1 zooms in, <1 zooms out."

    RequestCommand_pan:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: pan }
            params:
              type: object
              required: [offset]
              properties:
                offset:
                  type: integer
                  description: "Bases to shift. Positive = right, negative = left."

    RequestCommand_next_coverage_region:
      description: |
        Scans one track's coverage on the chromosome in view and goes to
        the next (or previous) region whose coverage meets the threshold;
        the answer comes when the scan ends. One scan runs at a time: a
        call while one runs answers 409 `BUSY`. A scan cancelled (by
        `cancel_coverage_scan` or the panel) answers at once with
        `cancelled` true; a scan that reads nothing for 60 s answers 504
        `STALLED`.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: next_coverage_region }
            params:
              type: object
              properties:
                direction:
                  description: "next (default) or prev; previous, left, right, +1, -1 and 1 are read too, and so is a number (its sign)."
                  oneOf:
                    - type: string
                      enum: [next, prev, previous, left, right, "+1", "-1", "1"]
                    - type: number
                threshold:
                  type: number
                  description: Coverage threshold (0 is any coverage above 0); a negative value, or none, uses the left panel's spinner value.
                track:
                  type: string
                  description: The track to scan; else the first visible coverage track, else the first visible alignment or signal track.

    RequestCommand_cancel_coverage_scan:
      description: Cancels the running coverage scan; answered 200 with cancelled true (and the scan's track and chromosome) when one ran, else false.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: cancel_coverage_scan }
            params:  { type: object }

    # Data queries
    RequestCommand_get_sequence:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: get_sequence }
            params:
              type: object
              properties:
                chromosome: { type: string, description: "Default: the chromosome in view." }
                start:      { type: integer, minimum: 0, description: "Default: the view's start." }
                end:        { type: integer, minimum: 1, description: "Default: the view's end. At most 100,000 bases a request (end - start)." }

    RequestCommand_get_genes:
      description: The genes in the region. Since 0.11.0 a gene is its ID on one chromosome, so an ID on two chromosomes is two genes, and so is a gene line repeated on one chromosome that overlaps no gene line of its ID there (Liftoff's copies). `geneName` is the annotation's name and `displayName` the name the screens show, which tells such genes apart.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: get_genes }
            params:
              type: object
              properties:
                chromosome: { type: string, description: "Default: the chromosome in view." }
                start:      { type: integer, minimum: 0, description: "Default: the view's start." }
                end:        { type: integer, minimum: 1, description: "Default: the view's end." }

    RequestCommand_search_genes:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: search_genes }
            params:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Case-insensitive partial match on gene name or ID. Up to 100 results; since 0.11.0 an ID on two chromosomes, or twice on one, is answered once for each gene.

    # Config
    RequestCommand_set_config:
      description: |
        Changes only the keys given. A key set_config does not read is
        refused by name (400 `INVALID_PARAMS`) before anything changes.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: set_config }
            params:
              type: object
              properties:
                showGrid:        { type: boolean }
                showLabels:      { type: boolean }
                darkMode:        { type: boolean }
                activeModeEnabled: { type: boolean }
                trackHeight:
                  type: number
                  minimum: 10
                  description: The default height of every track added from now on in this run; it changes no existing track unless apply_to_existing is true.
                apply_to_existing:
                  type: boolean
                  description: With trackHeight, true also sets that height on every track of the active group (default false).
                interfaceScale:  { type: number, description: "The interface scale, clamped to 0.5 to 3." }
                fontScale:       { type: number, description: "The text scale, clamped to 0.5 to 4." }
              patternProperties:
                "^_": {}
              additionalProperties: false

    RequestCommand_set_magnifier:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: set_magnifier }
            params:
              type: object
              properties:
                active:   { type: boolean, default: true, description: "false clears the API's magnifier and restores Alt+hover." }
                center_x: { type: number, description: "Centre X in the track area's pixels." }
                center_y: { type: number, description: "Centre Y in the track area's pixels (default: its vertical centre)." }
                zoom:     { type: number, description: "Magnification, clamped to 1.5 to 10." }
                genome_x: { type: integer, description: "A genomic position; takes priority over center_x." }

    # Selection
    RequestCommand_select_region:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: select_region }
            params:
              type: object
              required: [start, end]
              properties:
                chromosome: { type: string, description: "Default: the chromosome in view." }
                start:      { type: integer, minimum: 0 }
                end:        { type: integer, minimum: 1, description: "Exclusive; must be greater than start." }
                additive:   { type: boolean, default: false }

    RequestCommand_click_element:
      description: |
        Clicks the track area as the mouse would, in its pixels (0,0 at its
        top left, at the interface scale in force). Active Mode must be on
        (`set_config` `activeModeEnabled`), else 503 `NOT_READY`. Since
        0.11.0 a click on the sequence track selects a base, a block of
        bases or a window of the GC curve, and `popupText` gives its words.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: click_element }
            params:
              type: object
              required: [x, y]
              properties:
                x:      { type: number }
                y:      { type: number }
                button: { type: integer, default: 1, description: "1 (left) selects; 3 (right) on a read not selected or a modification mark opens its information; any other number acts as 1." }
                ctrl:   { type: boolean, default: false, description: "With button 1, add to the selection." }

    # Export
    RequestCommand_export_region:
      description: |
        Writes the view's region. Nothing is written when there is nothing
        to export: 409 `NO_REFERENCE` with no reference loaded, 409
        `NO_ANNOTATION` for GFF with no gene or feature track visible in the
        active group, 400 `INVALID_PARAMS` for another format.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: export_region }
            params:
              type: object
              required: [path]
              properties:
                path:   { type: string }
                format: { type: string, enum: [fasta, gff], default: fasta }

    RequestCommand_export_svg:
      description: |
        Starts an SVG export of the view on a background thread (poll
        `svg_export_status`). Each key not given takes its value from
        Settings > Output > Capture.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: export_svg }
            params:
              type: object
              properties:
                path:             { type: string, description: "Optional; defaults to an auto-named file in the Snapshots directory." }
                include_ruler:    { type: boolean }
                include_grid:     { type: boolean }
                include_labels:   { type: boolean }
                include_overview: { type: boolean }
                dark_mode:        { type: boolean }
                font_family:      { type: string, description: "CSS font-family for the text." }
                text_scale:       { type: number, minimum: 0.1, maximum: 10 }
                track_scale:      { type: number, minimum: 0.1, maximum: 10 }

    RequestCommand_export_image:
      description: |
        Writes the track area to an image file, as the Snapshot button
        does: the view rendered off screen with the ruler and every visible
        track. Each key not given takes its value from Settings > Output >
        Capture. A scale the GPU cannot render is lowered to the largest it
        can (`clamped` in the answer).
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: export_image }
            params:
              type: object
              properties:
                path:             { type: string, description: "The file to write; without it, the Snapshots directory and the configured name pattern." }
                format:           { type: string, description: "png, jpeg or tiff (jpg and tif are read as jpeg and tiff); default: the path's extension, else Settings'." }
                scale:            { type: number, exclusiveMinimum: 0 }
                transparent:      { type: boolean, description: "PNG and TIFF: keep the background transparent." }
                include_overlays: { type: boolean, description: "Draw the selection and hover overlays too." }
                jpeg_quality:     { type: integer, description: "JPEG only." }

    RequestCommand_svg_export_status:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: svg_export_status }
            params:  { type: object }

    # Loading state
    RequestCommand_loading_status:
      description: Since 0.11.0, while the built-in demo's files are made, a load in progress with stage "Preparing the built-in demo".
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: loading_status }
            params:  { type: object }

    RequestCommand_cancel_loading:
      description: Stops the load in progress (and a demo case's download) at its next progress step; the queue goes on with the next file. Answers cancelled true when a load was running.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: cancel_loading }
            params:  { type: object }

    # Bookmarks
    RequestCommand_add_bookmark:
      description: |
        Bookmarks the region given, as `region` or as chromosome, start and
        end (0-based start, end exclusive, digits alone); one that does not
        read is refused by name (400 `INVALID_PARAMS`). Without a region,
        the view, once a reference is loaded (503 `NOT_READY` before).
        Since 0.11.0 a bookmark belongs to a group: `group` names an open
        group ("" for every group; another name is 404 `NOT_FOUND`); without
        it, the group whose reference holds the region's chromosome, the
        active group first. The answer names the group.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: add_bookmark }
            params:
              type: object
              properties:
                label:      { type: string, description: "Default: the region." }
                name:       { type: string, description: "Read as label when label is absent." }
                region:     { type: string, description: "chromosome:start-end; the chromosome is everything before the last ':'." }
                chromosome: { type: string }
                start:      { type: [integer, string] }
                end:        { type: [integer, string] }
                group:      { type: string, description: "Since 0.11.0: the bookmark's group, or an empty text for every group." }

    RequestCommand_list_bookmarks:
      description: Each bookmark with its index, label, region and (since 0.11.0) group. `view` sets the left panel's list to This group or All and lists what it shows; the answer also gives `view` and `activeGroup`.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: list_bookmarks }
            params:
              type: object
              properties:
                view: { type: string, enum: [group, all], description: "Since 0.11.0. group: the active group's bookmarks and those of every group; all: every bookmark." }

    RequestCommand_remove_bookmark:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: remove_bookmark }
            params:
              type: object
              required: [index]
              properties:
                index: { type: integer, minimum: 0 }

    RequestCommand_goto_bookmark:
      description: Goes to the bookmark's region. Since 0.11.0 a bookmark of another open group switches to that group first; the answer gives `group` and `switched`.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: goto_bookmark }
            params:
              type: object
              required: [index]
              properties:
                index: { type: integer, minimum: 0 }

    RequestCommand_list_chromosomes:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: list_chromosomes }
            params:  { type: object }

    # Track options. Each of these commands finds the track by `name` in the
    # active group (404 NOT_FOUND), refuses a track of another kind (400
    # NOT_SUPPORTED), and checks every key before anything changes: a key it
    # does not read, a word not among its words, a switch that is not true or
    # false, a number out of range or a colour that is not [r, g, b] is refused
    # by name (400 INVALID_PARAMS).
    RequestCommand_set_track_options:
      description: Since 0.11.0. The common controls of every track's row in the track panel. The answer gives `style`.
      examples:
        - { command: set_track_options, params: { name: genes.gtf, label_size: 12, legend: false } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: set_track_options }
            params:
              type: object
              required: [name]
              properties:
                name:       { type: string }
                color:      { $ref: "#/components/schemas/Colour", description: "The label's colour (and a gene track's data in Uniform colouring, an alignment track's in Solid)." }
                label_gap:  { type: number, minimum: 0, maximum: 30 }
                label_size: { type: number, minimum: 0, maximum: 18, description: "Points; 0 automatic." }
                legend:     { type: boolean }
              patternProperties:
                "^_": {}
              additionalProperties: false

    RequestCommand_set_coverage_options:
      description: Since 0.11.0. A coverage track's section of the track panel. The answer gives the track's `options`.
      examples:
        - { command: set_coverage_options, params: { name: coverage.bedgraph, style: bars, scale: log10, auto_scale: false, y_min: 0, y_max: 100 } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: set_coverage_options }
            params:
              type: object
              required: [name]
              properties:
                name:        { type: string }
                style:       { type: string, enum: [area, line, bars, heatmap] }
                scale:       { type: string, enum: [linear, log, log2, log10, sqrt, asinh], description: "log is read as log10." }
                auto_scale:  { type: boolean }
                y_min:       { $ref: "#/components/schemas/AxisBound" }
                y_max:       { $ref: "#/components/schemas/AxisBound" }
                color_mode:  { type: string, enum: [solid, heatmap] }
                fill_color:  { $ref: "#/components/schemas/Colour" }
                line_color:  { $ref: "#/components/schemas/Colour" }
                line_width:  { type: number, minimum: 0.5, maximum: 10 }
                fill_alpha:  { type: number, minimum: 0, maximum: 1 }
                show_fill:   { type: boolean }
              patternProperties:
                "^_": {}
              additionalProperties: false

    RequestCommand_set_signal_options:
      description: |
        A signal track's section of the track panel. Since 0.11.0 every key
        is checked before anything changes and a key the command does not
        read is refused; show_axis, the three colours and show_negative are
        new.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: set_signal_options }
            params:
              type: object
              required: [name]
              properties:
                name:             { type: string }
                style:            { type: string, enum: [area, line, bars, heatmap, step, points] }
                scale:            { $ref: "#/components/schemas/AxisScale" }
                auto_scale:       { type: boolean }
                y_min:            { $ref: "#/components/schemas/AxisBound" }
                y_max:            { $ref: "#/components/schemas/AxisBound" }
                smoothing:        { type: number, minimum: 0, maximum: 1000000, description: "Bases." }
                smoothing_method: { type: string, enum: [mean, median, max] }
                color_mode:       { type: string, enum: [solid, gradient, diverging, heatmap] }
                window_function:  { type: string, enum: [mean, max, min, sum, coverage] }
                line_width:       { type: number, minimum: 0.5, maximum: 10 }
                fill_alpha:       { type: number, minimum: 0.0, maximum: 1.0 }
                show_axis:        { type: boolean }
                fill_color:       { $ref: "#/components/schemas/Colour" }
                line_color:       { $ref: "#/components/schemas/Colour" }
                negative_color:   { $ref: "#/components/schemas/Colour" }
                show_negative:    { type: boolean, default: true, description: "Show negative: true draws values below 0 below the zero line (in the Bars style in the negative colour); false draws a value below 0 at 0, and the axis keeps 0 at its foot." }
              patternProperties:
                "^_": {}
              additionalProperties: false

    RequestCommand_set_variant_options:
      description: A variant track's section of the track panel. Since 0.11.0 a key the command does not read is refused, and the stem height, marker size, opacity and the seven type colours are new.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: set_variant_options }
            params:
              type: object
              required: [name]
              properties:
                name:             { type: string }
                display_mode:     { type: string, enum: [lollipop, diamonds, bars, density] }
                color_mode:       { type: string, enum: [type, quality, frequency, filter, impact, zygosity] }
                filter_pass_only: { type: boolean }
                min_quality:      { type: number, minimum: 0 }
                min_allele_freq:  { type: number, minimum: 0, maximum: 1 }
                show_labels:      { type: boolean }
                show_snps:        { type: boolean }
                show_insertions:  { type: boolean }
                show_deletions:   { type: boolean }
                show_svs:         { type: boolean, description: "Structural and copy-number variants." }
                show_other:       { type: boolean, description: "Multi-base substitutions and complex alleles." }
                stem_height:      { type: number, minimum: 0.1, maximum: 1 }
                marker_size:      { type: number, minimum: 2, maximum: 20, description: "The marker's radius in pixels." }
                opacity:          { type: number, minimum: 0.1, maximum: 1 }
                color_snp:        { $ref: "#/components/schemas/Colour" }
                color_insertion:  { $ref: "#/components/schemas/Colour" }
                color_deletion:   { $ref: "#/components/schemas/Colour" }
                color_mnp:        { $ref: "#/components/schemas/Colour" }
                color_sv:         { $ref: "#/components/schemas/Colour" }
                color_cnv:        { $ref: "#/components/schemas/Colour" }
                color_complex:    { $ref: "#/components/schemas/Colour" }
              patternProperties:
                "^_": {}
              additionalProperties: false

    RequestCommand_set_interaction_options:
      description: |
        An interaction track's section of the track panel. The answer gives
        `interaction` (the opacity as drawn and whether it is the track's
        own) and, since 0.11.0, `matrix` (the Matrix display's state). Since
        0.11.0 a key the command does not read is refused, the three
        colours, `min_distance` and the Matrix display (`display_mode`
        matrix and the `matrix_*` keys) are new.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: set_interaction_options }
            params:
              type: object
              required: [name]
              properties:
                name:             { type: string }
                display_mode:     { type: string, enum: [arcs, heatmap, links, matrix] }
                color_mode:       { type: string, enum: [score, distance, solid] }
                min_score:        { type: number, minimum: 0, maximum: 1000000000, description: "Min score: loops scored below it are not drawn (a loop without a score passes only a minimum of 0)." }
                min_distance:     { type: integer, minimum: 0, maximum: 1000000000, default: 0, description: "Min distance: the least distance in whole bases between a loop's two anchors on one chromosome; closer loops are not drawn." }
                intra_chr_only:   { type: boolean }
                arc_alpha:        { type: number, minimum: 0.1, maximum: 1.0, description: "The track's own opacity, kept on both colour schemes." }
                line_width:       { type: number, minimum: 0.5, maximum: 10 }
                arc_color:        { $ref: "#/components/schemas/Colour", description: "The Solid mode's colour." }
                low_score_color:  { $ref: "#/components/schemas/Colour", description: "Kept on both schemes; the high score colour stays as drawn." }
                high_score_color: { $ref: "#/components/schemas/Colour" }
                matrix_value:     { type: string, enum: [count, balanced, obs_exp], description: "Since 0.11.0." }
                matrix_scale:     { type: string, enum: [linear, log] }
                matrix_bin:       { type: integer, minimum: 0, maximum: 100000000, description: "Bases a bin; 0 follows the zoom." }
                matrix_tads:      { type: boolean, description: "Outline the domains between TAD Boundary Detection's boundaries." }
                matrix_loops:     { type: string, description: "An interaction track of the group whose loops are ringed; an empty text for none." }
                matrix_filters:   { type: boolean, default: true, description: "Apply filters: true (the default) bins the contacts the track's Min score and Min distance keep (at their defaults, 0 and 0, every contact not scored below 0), as Contact Matrix does by default; false bins every contact." }
              patternProperties:
                "^_": {}
              additionalProperties: false

    RequestCommand_set_sequence_options:
      description: Since 0.11.0. A sequence track's section of the track panel, with the value axis of its GC curve in percent. The answer gives the track's `options`.
      examples:
        - { command: set_sequence_options, params: { name: chr19.fa, show_gc: true, scale: linear, auto_scale: false, y_min: 30, y_max: 70 } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: set_sequence_options }
            params:
              type: object
              required: [name]
              properties:
                name:         { type: string }
                show_bases:   { type: boolean }
                show_gc:      { type: boolean }
                color_scheme: { type: string, enum: [default, ncbi, sanger, colorblind] }
                scale:        { $ref: "#/components/schemas/AxisScale" }
                auto_scale:   { type: boolean }
                y_min:        { $ref: "#/components/schemas/AxisBound" }
                y_max:        { $ref: "#/components/schemas/AxisBound" }
              patternProperties:
                "^_": {}
              additionalProperties: false

    RequestCommand_set_gene_options:
      description: Since 0.11.0. A gene track's section of the track panel. The answer gives the track's `options`.
      examples:
        - { command: set_gene_options, params: { name: genes.gtf, isoform_gap: 12, lane_height: 16, color_lncrna: [200, 40, 40] } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: set_gene_options }
            params:
              type: object
              required: [name]
              properties:
                name:                 { type: string }
                show_labels:          { type: boolean, description: "Every text the track draws on its body: names, detail labels, badges." }
                color_mode:           { type: string, enum: [biotype, uniform] }
                body_height:          { type: number, minimum: 6, maximum: 120 }
                isoform_row_height:   { type: number, minimum: 0, maximum: 120, description: "0: the body height." }
                isoform_gap:          { type: number, minimum: -1, maximum: 40, description: "-1: automatic." }
                lane_height:          { type: number, minimum: 0, maximum: 60, description: "A transcript drawn in two lanes: each lane's height; 0 shares the isoform's row." }
                lane_gap:             { type: number, minimum: -1, maximum: 60, description: "-1: automatic." }
                intron_width:         { type: number, minimum: 0.5, maximum: 8 }
                row_spacing:          { type: number, minimum: 0, maximum: 20 }
                opacity:              { type: number, minimum: 0.1, maximum: 1 }
                feature_label_size:   { type: number, minimum: 0, maximum: 18, description: "0: automatic." }
                gene_name_size:       { type: number, minimum: 0, maximum: 18, description: "0: automatic." }
                per_track_colours:    { type: boolean, description: "The biotype colours below are the track's own (true) or Settings' (false)." }
                color_protein_coding: { $ref: "#/components/schemas/Colour" }
                color_lncrna:         { $ref: "#/components/schemas/Colour" }
                color_circrna:        { $ref: "#/components/schemas/Colour" }
                color_trna:           { $ref: "#/components/schemas/Colour" }
                color_rrna:           { $ref: "#/components/schemas/Colour" }
                color_mirna:          { $ref: "#/components/schemas/Colour" }
                color_snrna:          { $ref: "#/components/schemas/Colour" }
                color_snorna:         { $ref: "#/components/schemas/Colour" }
                color_pseudogene:     { $ref: "#/components/schemas/Colour" }
                color_ig_tr:          { $ref: "#/components/schemas/Colour" }
                color_misc_rna:       { $ref: "#/components/schemas/Colour" }
                color_default:        { $ref: "#/components/schemas/Colour" }
                lod_density_ppb:      { type: number, minimum: 0, maximum: 10, description: "Pixels a base; 0: Settings' threshold." }
                lod_boundary_ppb:     { type: number, minimum: 0, maximum: 10 }
                lod_feature_ppb:      { type: number, minimum: 0, maximum: 10 }
              patternProperties:
                "^_": {}
              additionalProperties: false

    RequestCommand_set_feature_options:
      description: Since 0.11.0. A feature track's section of the track panel (a junction track's Sashimi keys are set_sashimi_options', and are refused here naming it). The answer gives the track's `options`.
      examples:
        - { command: set_feature_options, params: { name: peaks.bed, box_height: 26, row_gap: 9, feature_colour: [70, 110, 160] } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: set_feature_options }
            params:
              type: object
              required: [name]
              properties:
                name:           { type: string }
                show_labels:    { type: boolean }
                box_height:     { type: number, minimum: 4, maximum: 60, description: "The boxes' height in pixels (18 for a new track)." }
                row_gap:        { type: number, minimum: 0, maximum: 40 }
                corner_radius:  { type: number, minimum: 0, maximum: 20 }
                opacity:        { type: number, minimum: 0.1, maximum: 1 }
                feature_colour: { $ref: "#/components/schemas/Colour", description: "Every feature of the track in this colour, on both schemes." }
                custom_colour:  { type: boolean, description: "false gives the file's or the scheme's colours back." }
              patternProperties:
                "^_": {}
              additionalProperties: false

    RequestCommand_set_alignment_options:
      description: |
        An alignment track's options. Only the keys the client wants to
        change need be given; the answer's `options` holds every option of
        the track (send the name alone to read them). A key the command
        does not read is passed over; a value of the wrong kind or out of
        range, for the keys the list below gives with a range or words, is
        refused by name before anything changes. The keys new in 0.11.0:
        the strips' heights, expansions and views (`mod_strip`,
        `polya_strip`, `mutation_strip`: objects of set_aggregate_options'
        keys, a strip's `min_mapq` refused), `open_strip_as_track`,
        `reads_are_rna`, `mod_colours`, the calls matrix (`display_mode`
        calls_matrix and the `matrix_*` keys), the keys by a site
        (`group_by_site`, `sort_by_site`), and the coverage strip's value
        axis (`coverage_scale`, `coverage_auto_scale`, `coverage_y_min`,
        `coverage_y_max`). The four rate-line colour keys of 0.10.0
        (`mut_agg_total_line_color`, `mut_agg_sub_line_color`,
        `mut_agg_del_line_color`, `mut_agg_ins_line_color`) are refused by
        name: nothing draws them.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: set_alignment_options }
            params:
              type: object
              required: [name]
              additionalProperties: true
              properties:
                name:                     { type: string }
                show_unique_primary:      { type: boolean }
                show_multi_primary:       { type: boolean }
                show_multi_secondary:     { type: boolean }
                show_mate_pairs:          { type: boolean }
                show_back_splice:         { type: boolean }
                density:                  { type: string, description: "auto, or a fixed level (1 to 4)." }
                display_mode:             { type: string, enum: [reads, calls_matrix], description: "Since 0.11.0: the reads, or the calls matrix (a row a read, a column a modified site)." }
                matrix_codes:             { type: [string, array], items: { type: string }, description: "Since 0.11.0: a modification's code, a list of codes, or all." }
                matrix_cells:             { type: string, enum: [probability, class], description: "Since 0.11.0." }
                matrix_min_modified:      { type: integer, minimum: 1, maximum: 100000, description: "Since 0.11.0: the reads a site needs called modified (2 by default)." }
                read_color_mode:          { type: string, description: "class (any other text reads as class), strand, insert_size, solid, mapq or indegra." }
                show_trans_splice:        { type: boolean }
                show_paired_as_fragments: { type: boolean }
                sort_by:                  { type: string, enum: [start, end, length, ref_length, edit_extent, mod_extent, mapq, strand, base_at, call_probability_at], description: "base_at and call_probability_at (since 0.11.0) need sort_by_site." }
                sort_order:               { type: string, enum: [ascending, descending] }
                group_by:                 { type: string, enum: [none, type, strand, haplotype, indegra, class, base_at, call_at], description: "base_at and call_at (since 0.11.0) need group_by_site." }
                group_by_site:            { $ref: "#/components/schemas/LayoutSite" }
                sort_by_site:             { $ref: "#/components/schemas/LayoutSite" }
                packing:                  { type: string, enum: [dense, one_per_row] }
                mod_extent_unit:          { type: string, enum: [per_read, per_base] }
                filter_indegra:           { type: string, enum: [all, hide_reallocated, reallocated_only] }
                read_sort_mode:           { type: string, enum: [start_pos, end_pos, length] }
                segregate_reads_by_class: { type: boolean }
                show_base_modifications:  { type: boolean }
                show_mod_summary_strip:   { type: boolean }
                mod_prob_threshold:       { type: integer, minimum: 0, maximum: 255, description: "The ML value; 128 is a probability of 0.5." }
                mod_colours:              { type: object, description: "Since 0.11.0: {modification code: [r, g, b] or null}; null gives the code back to the palette.", additionalProperties: { oneOf: [ { $ref: "#/components/schemas/Colour" }, { type: "null" } ] } }
                reads_are_rna:            { oneOf: [ { type: boolean }, { type: string, enum: [auto] } ], description: "Since 0.11.0: the modifications named in RNA words (true), DNA words (false), or as the reads' basecall model and references say (auto)." }
                show_polya_tail:          { type: boolean }
                show_mod_aggregator:      { type: boolean }
                show_polya_aggregator:    { type: boolean }
                show_mutation_aggregator: { type: boolean }
                strip_height:             { type: number, minimum: 16, maximum: 200, description: "Since 0.11.0: the strips' compact height (32 by default)." }
                strip_expanded_height:    { type: number, minimum: 24, maximum: 600, description: "Since 0.11.0: the strips' expanded height (120 by default)." }
                mod_strip_height:         { oneOf: [ { const: 0 }, { type: number, minimum: 16, maximum: 200 } ], description: "Since 0.11.0: 0 (the shared strip_height) or 16 to 200." }
                polya_strip_height:       { oneOf: [ { const: 0 }, { type: number, minimum: 16, maximum: 200 } ], description: "Since 0.11.0: 0 (the shared strip_height) or 16 to 200." }
                mutation_strip_height:    { oneOf: [ { const: 0 }, { type: number, minimum: 16, maximum: 200 } ], description: "Since 0.11.0: 0 (the shared strip_height) or 16 to 200." }
                mod_strip_expanded_height:      { oneOf: [ { const: 0 }, { type: number, minimum: 24, maximum: 600 } ], description: "Since 0.11.0: 0 (the shared strip_expanded_height) or 24 to 600." }
                polya_strip_expanded_height:    { oneOf: [ { const: 0 }, { type: number, minimum: 24, maximum: 600 } ], description: "Since 0.11.0: 0 (the shared strip_expanded_height) or 24 to 600." }
                mutation_strip_expanded_height: { oneOf: [ { const: 0 }, { type: number, minimum: 24, maximum: 600 } ], description: "Since 0.11.0: 0 (the shared strip_expanded_height) or 24 to 600." }
                expand_mod_strip:         { type: boolean }
                expand_polya_strip:       { type: boolean }
                expand_mutation_strip:    { type: boolean }
                mod_strip:                { type: object, description: "Since 0.11.0: the modification strip's options, set_aggregate_options' keys of a modification density track." }
                polya_strip:              { type: object, description: "Since 0.11.0: the poly(A) strip's options, set_aggregate_options' keys of a poly(A) tail track." }
                mutation_strip:           { type: object, description: "Since 0.11.0: the mutation strip's options, set_aggregate_options' keys of a variant summary." }
                open_strip_as_track:      { type: string, description: "Since 0.11.0: modifications, polya or mutation, or one lane of a strip (modifications:a, mutation:A>G, mutation:substitution), opened as an aggregate track below this one with the strip's options; the answer names it in opened_track." }
                coverage_scale:           { $ref: "#/components/schemas/AxisScale" }
                coverage_auto_scale:      { type: boolean }
                coverage_y_min:           { $ref: "#/components/schemas/AxisBound" }
                coverage_y_max:           { $ref: "#/components/schemas/AxisBound" }
                coverage_log_scale:       { type: boolean, description: "The Log switch of 0.10.0: log10 (true) or linear, read when coverage_scale is not given." }
                max_reads:                { type: integer, minimum: 0, maximum: 1000000, description: "Reads kept in view when subsampling is on (0: no cap); the view loads again." }
                subsetting:               { type: boolean }
                min_mapq:                 { type: integer, minimum: 0, maximum: 255 }

    LayoutSite:
      description: "A site the reads are grouped or sorted by (since 0.11.0); null or none clears the key."
      oneOf:
        - type: "null"
        - type: string
          enum: [none]
        - type: object
          required: [by, chromosome, position]
          properties:
            by:             { type: string, enum: [base, call, call_probability], description: "group_by_site: base or call; sort_by_site: base or call_probability." }
            chromosome:     { type: string }
            position:       { type: integer, minimum: 1, description: "1-based." }
            code:           { type: string, description: "A modification's code: a letter or a ChEBI number." }
            reference_base: { type: string, enum: [A, C, G, T, N, ""] }

    # Read aggregates and transcript DTI
    RequestCommand_add_aggregate_track:
      description: |
        Adds a modification density, poly(A) tail or (since 0.11.0)
        variant summary track over an alignment track's BAM, below it in
        the source's group; any option of set_aggregate_options may be
        given too, and an option refused adds no track. The answer names
        the new track and its group, and carries a `warning` when
        `min_alt_per_strand` is set on RNA reads.
      examples:
        - { command: add_aggregate_track, params: { source: reads.bam, kind: variants, test: fisher, control: ivt.bam } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: add_aggregate_track }
            params:
              type: object
              required: [source, kind]
              properties:
                source: { type: string, description: "The alignment track's name." }
                kind:   { type: string, enum: [modifications, polya, variants] }
                min_mapq:        { type: integer, minimum: 0, maximum: 255 }
                max_span:        { type: integer, minimum: 1, description: "Count up to: a view wider than this many bases is not counted. A modification density or poly(A) track: up to 100,000,000 (2,000,000 by default); a variant summary or an alignment track's mutation strip: 5,000,000 by default. A session keeps each track's own." }
                colour:          { $ref: "#/components/schemas/Colour" }
                scale:           { $ref: "#/components/schemas/AxisScale" }
                auto_scale:      { type: boolean }
                y_min:           { type: number }
                y_max:           { type: number }
                display:         { type: string, enum: [bars, line, heat, dots, box, histogram, violin] }
                height:          { type: string, enum: [stoichiometry, modified, calls, coverage, confidence, alt_fraction, alt_count, depth] }
                opacity:         { type: string, enum: [confidence, stoichiometry, significance, none] }
                opacity_floor:   { type: number, minimum: 0, maximum: 1 }
                colour_mode:     { type: string, enum: [by_type, single] }
                code_colours:    { type: [object, "null"], description: "{code: [r, g, b] or null}; null clears every colour of the user's." }
                call_cutoff:     { type: number, minimum: 0.5, maximum: 0.99 }
                min_coverage:    { type: integer, minimum: 1, maximum: 100000 }
                strand:          { type: string, enum: [both, plus, minus, "+", "-"] }
                resolution:      { type: string, enum: [site, window, bins, auto, automatic] }
                width:           { type: integer, minimum: 1, maximum: 100000, description: "A window's or a bin's width in nt." }
                pixel_rule:      { type: string, enum: [largest, mean] }
                test:            { type: string, enum: [binomial, fisher] }
                background:      { type: number, minimum: 0.0001, maximum: 0.5 }
                control:         { type: [string, "null"], description: "An alignment track of the group that reads a BAM; an empty text for none." }
                significance:    { type: string, enum: [p, q] }
                significance_cutoff: { type: number, exclusiveMinimum: 0, maximum: 1 }
                significance_saturation: { type: number, minimum: 1, maximum: 300 }
                failed_sites:    { type: string, enum: [faint, hidden] }
                lift_from:       { type: [string, array, "null"], items: { type: string }, description: "gene, a transcript's name, or a list of names: the isoforms whose reads' calls are counted on the transcript in view." }
                failing_opacity: { type: number, minimum: 0, maximum: 1 }
                split:           { type: string, enum: [none, code, class, kind] }
                codes:           { type: [string, array, "null"], items: { type: string }, description: "The modifications drawn: a list of codes or a comma-separated text; empty, all or null for every code." }
                statistic:       { type: string, enum: [median, mean] }
                anchor:          { type: string, enum: [three_prime, right_end] }
                bin_width:       { type: integer, minimum: 0, maximum: 10000000, description: "Bases; 0 automatic." }
                min_reads:       { type: integer, minimum: 1, maximum: 100000 }
                min_length:      { type: integer, minimum: 0, maximum: 100000 }
                max_length:      { type: integer, minimum: 0, maximum: 100000 }
                tail_bins:       { type: string, enum: [bins, sequence] }
                cutoff_on:       { type: string, enum: [p, q] }
                cutoff:          { type: number, exclusiveMinimum: 0, maximum: 1 }
                opaque_at:       { type: number, exclusiveMinimum: 0, maximum: 1 }
                failing:         { type: string, enum: [faint, hidden] }
                min_base_quality: { type: integer, minimum: 0, maximum: 60 }
                min_depth:       { type: integer, minimum: 1 }
                min_alt_fraction: { type: number, minimum: 0, maximum: 1 }
                min_alt_reads:   { type: integer, minimum: 1 }
                changes:         { type: string, description: "all, substitutions, or a list such as A>G,T>C." }
                error_model:     { type: string, enum: [qualities, fixed] }
                error_rate:      { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1 }
                vcf_track:       { type: string, description: "A variant track of the group, or an empty text." }
                colours:         { type: object, description: "{A, C, G, T, deletion, insertion: [r, g, b]}." }
                min_alt_per_strand: { type: integer, minimum: 0, description: "Min alt reads a strand: 0 (off) by default; 2 suggested. A site is judged only where its reads of the reference base number at least this many on each strand, and there it lists only when its main change (the change with the most reads) has as many reads on each strand; a site whose reference base has fewer reads on a strand is not judged and lists, so reads that all lie on one strand, as direct RNA reads do, lose no site." }
              additionalProperties: false

    RequestCommand_set_aggregate_options:
      description: |
        The options of a read aggregate track (found in any group), all or
        nothing; the answer gives the options as they stand.
        add_aggregate_track reads the same keys. Each kind reads its own keys and
        refuses another kind's by name; every key is checked before any is
        applied. Every kind: `min_mapq`, `max_span`, and the height's value
        axis `scale`, `auto_scale`, `y_min`, `y_max` (since 0.11.0; a
        `y_min` or a `y_max` alone makes the axis manual, a `y_max` of 0
        alone keeps it fitted). A modification density track and a poly(A)
        tail track also read `colour`. A modification density track
        refuses 0.10.0's `threshold`, replaced by `call_cutoff`. A
        modification density track:
        display (bars, line, heat, dots, box, histogram, violin), height
        (stoichiometry, modified, calls, confidence), opacity (confidence,
        stoichiometry, significance, none), opacity_floor, colour_mode
        (by_type, single), code_colours, call_cutoff, min_coverage, strand,
        resolution, width, pixel_rule, test (binomial, fisher), background,
        control, significance, significance_cutoff,
        significance_saturation, failed_sites, lift_from (since 0.11.0),
        failing_opacity, split (none, code) and codes (since 0.11.0). A
        poly(A) tail track: display (bars, box, violin, dots), statistic,
        anchor, bin_width, min_reads, min_length, max_length, tail_bins. A
        variant summary (since 0.11.0): display (bars, line, heat), height
        (alt_fraction, alt_count, depth), opacity (significance, none),
        opacity_floor, cutoff_on, cutoff, opaque_at, failing,
        min_base_quality, min_depth, min_alt_fraction, min_alt_reads,
        changes, error_model, error_rate, vcf_track, colours,
        min_alt_per_strand, test (binomial, fisher), control,
        failing_opacity, split (none, class, kind). A variant summary's
        `control` that the group lacks is 404 `TRACK_NOT_FOUND`; any other
        refusal (a modification density's unknown control included) is 400
        `INVALID_PARAMS`.
      examples:
        - { command: set_aggregate_options, params: { name: "reads.bam mod density", split: code, scale: linear, auto_scale: true } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: set_aggregate_options }
            params:
              type: object
              required: [name]
              properties:
                name: { type: string }
                min_mapq:        { type: integer, minimum: 0, maximum: 255 }
                max_span:        { type: integer, minimum: 1, description: "Count up to: a view wider than this many bases is not counted. A modification density or poly(A) track: up to 100,000,000 (2,000,000 by default); a variant summary or an alignment track's mutation strip: 5,000,000 by default. A session keeps each track's own." }
                colour:          { $ref: "#/components/schemas/Colour" }
                scale:           { $ref: "#/components/schemas/AxisScale" }
                auto_scale:      { type: boolean }
                y_min:           { type: number }
                y_max:           { type: number }
                display:         { type: string, enum: [bars, line, heat, dots, box, histogram, violin] }
                height:          { type: string, enum: [stoichiometry, modified, calls, coverage, confidence, alt_fraction, alt_count, depth] }
                opacity:         { type: string, enum: [confidence, stoichiometry, significance, none] }
                opacity_floor:   { type: number, minimum: 0, maximum: 1 }
                colour_mode:     { type: string, enum: [by_type, single] }
                code_colours:    { type: [object, "null"], description: "{code: [r, g, b] or null}; null clears every colour of the user's." }
                call_cutoff:     { type: number, minimum: 0.5, maximum: 0.99 }
                min_coverage:    { type: integer, minimum: 1, maximum: 100000 }
                strand:          { type: string, enum: [both, plus, minus, "+", "-"] }
                resolution:      { type: string, enum: [site, window, bins, auto, automatic] }
                width:           { type: integer, minimum: 1, maximum: 100000, description: "A window's or a bin's width in nt." }
                pixel_rule:      { type: string, enum: [largest, mean] }
                test:            { type: string, enum: [binomial, fisher] }
                background:      { type: number, minimum: 0.0001, maximum: 0.5 }
                control:         { type: [string, "null"], description: "An alignment track of the group that reads a BAM; an empty text for none." }
                significance:    { type: string, enum: [p, q] }
                significance_cutoff: { type: number, exclusiveMinimum: 0, maximum: 1 }
                significance_saturation: { type: number, minimum: 1, maximum: 300 }
                failed_sites:    { type: string, enum: [faint, hidden] }
                lift_from:       { type: [string, array, "null"], items: { type: string }, description: "gene, a transcript's name, or a list of names: the isoforms whose reads' calls are counted on the transcript in view." }
                failing_opacity: { type: number, minimum: 0, maximum: 1 }
                split:           { type: string, enum: [none, code, class, kind] }
                codes:           { type: [string, array, "null"], items: { type: string }, description: "The modifications drawn: a list of codes or a comma-separated text; empty, all or null for every code." }
                statistic:       { type: string, enum: [median, mean] }
                anchor:          { type: string, enum: [three_prime, right_end] }
                bin_width:       { type: integer, minimum: 0, maximum: 10000000, description: "Bases; 0 automatic." }
                min_reads:       { type: integer, minimum: 1, maximum: 100000 }
                min_length:      { type: integer, minimum: 0, maximum: 100000 }
                max_length:      { type: integer, minimum: 0, maximum: 100000 }
                tail_bins:       { type: string, enum: [bins, sequence] }
                cutoff_on:       { type: string, enum: [p, q] }
                cutoff:          { type: number, exclusiveMinimum: 0, maximum: 1 }
                opaque_at:       { type: number, exclusiveMinimum: 0, maximum: 1 }
                failing:         { type: string, enum: [faint, hidden] }
                min_base_quality: { type: integer, minimum: 0, maximum: 60 }
                min_depth:       { type: integer, minimum: 1 }
                min_alt_fraction: { type: number, minimum: 0, maximum: 1 }
                min_alt_reads:   { type: integer, minimum: 1 }
                changes:         { type: string, description: "all, substitutions, or a list such as A>G,T>C." }
                error_model:     { type: string, enum: [qualities, fixed] }
                error_rate:      { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1 }
                vcf_track:       { type: string, description: "A variant track of the group, or an empty text." }
                colours:         { type: object, description: "{A, C, G, T, deletion, insertion: [r, g, b]}." }
                min_alt_per_strand: { type: integer, minimum: 0, description: "Min alt reads a strand: 0 (off) by default; 2 suggested. A site is judged only where its reads of the reference base number at least this many on each strand, and there it lists only when its main change (the change with the most reads) has as many reads on each strand; a site whose reference base has fewer reads on a strand is not judged and lists, so reads that all lie on one strand, as direct RNA reads do, lose no site." }
              additionalProperties: false

    RequestCommand_aggregate_rows:
      description: |
        The rows an aggregate track gives the region [start, end), counted
        on a thread of their own with the track's options; the answer comes
        when they are counted. A region wider than the track's max_span is
        refused. With `path` the rows are written there (TSV by default, or
        bedMethyl for a modification density: every site with a modified or
        unmodified call) and the answer says how many. A variant summary's
        answer gives what its q is over (`q_over`), the test in words
        (`test`), what the strand rule did (`strand_rule`; `strand_filtered`,
        the sites it left out; `strand_unjudged`, the sites listed that it
        could not judge) and the control (`control`); /state gives the same
        under the track's `variants`.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: aggregate_rows }
            params:
              type: object
              required: [name]
              properties:
                name:       { type: string }
                chromosome: { type: string, description: "Default: the chromosome in view." }
                start:      { type: integer, minimum: 0, description: "Default: the view's start." }
                end:        { type: integer, description: "Default: the view's end; exclusive." }
                bin_width:  { type: integer, minimum: 1, description: "A modification density: 1 a site, more bins of that width; a poly(A) track: bases a bin (its own, else 100)." }
                resolution: { type: string, enum: [site, window, bins, auto, automatic], description: "A modification density only; auto is read as site." }
                width:      { type: integer, minimum: 1, maximum: 100000, description: "A modification density only: a window's or a bin's width." }
                path:       { type: string, description: "Write the rows to this file instead of answering them." }
                format:     { type: string, enum: [json, tsv, bedmethyl], description: "json (the answer, without path), tsv or bedmethyl (with path; bedmethyl for a modification density). A variant summary writes tsv." }

    RequestCommand_add_dti_track:
      description: Adds a transcript DTI track, from an alignment track's YD tags (source) or from INDEGRA's process table (path, recognised by its header line).
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: add_dti_track }
            params:
              type: object
              properties:
                source: { type: string }
                path:   { type: string }

    RequestCommand_set_dti_options:
      description: A transcript DTI track's options, every key checked before anything changes; since 0.11.0 the colour ramp's value axis (`scale`, `auto_scale`, `y_min`, `y_max`; Auto fits the table's DTI) and a key the command does not read is refused. The answer gives `dti`.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: set_dti_options }
            params:
              type: object
              required: [name]
              properties:
                name:         { type: string }
                colour_scale: { type: string, enum: [sequential, diverging] }
                color_scale:  { type: string, enum: [sequential, diverging] }
                value_min:    { type: number, minimum: 0, maximum: 20, description: "The range's name of before: read as y_min where y_min is not given." }
                value_max:    { type: number, minimum: 0, maximum: 20, description: "Read as y_max where y_max is not given." }
                labels:       { type: boolean }
                scale:        { $ref: "#/components/schemas/AxisScale" }
                auto_scale:   { type: boolean }
                y_min:        { $ref: "#/components/schemas/AxisBound" }
                y_max:        { $ref: "#/components/schemas/AxisBound" }
              patternProperties:
                "^_": {}
              additionalProperties: false

    RequestCommand_dti_lookup:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: dti_lookup }
            params:
              type: object
              required: [name, transcript]
              properties:
                name:       { type: string }
                transcript: { type: string, description: "A transcript ID, with or without its version." }

    # Sashimi and overlay tracks (since 0.11.0)
    RequestCommand_add_sashimi_track:
      description: Since 0.11.0. A Sashimi track over the BAM of the alignment track `source` (found in any group, the active one first), added below it in its group; any key of set_sashimi_options may be given, and one refused adds nothing. The answer names the track and its group and gives its options.
      examples:
        - { command: add_sashimi_track, params: { source: reads.bam, min_count: 5, hide_spanning: true } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: add_sashimi_track }
            params:
              type: object
              required: [source]
              properties:
                source: { type: string, description: "The alignment track's name." }
                min_mapq:              { type: integer, minimum: 0, maximum: 255 }
                min_overhang:          { type: integer, minimum: 1, maximum: 10000 }
                include_supplementary: { type: boolean }
                max_span:              { type: integer, minimum: 1000, maximum: 10000000, description: "Count up to: a wider view is not counted (2,000,000 bases by default)." }
                min_count:             { type: integer, minimum: 1, maximum: 1000000000, description: "Least reads: junctions below it are not drawn." }
                arc_scale:             { type: string, enum: [height, width] }
                shared_scale:          { type: boolean }
                show_counts:           { type: boolean }
                show_profile:          { type: boolean }
                profile_color:         { $ref: "#/components/schemas/Colour" }
                profile_opacity:       { type: number, minimum: 0, maximum: 1 }
                line_width:            { type: number, minimum: 0.5, maximum: 10 }
                scale:                 { $ref: "#/components/schemas/AxisScale" }
                auto_scale:            { type: boolean }
                y_min:                 { $ref: "#/components/schemas/AxisBound" }
                y_max:                 { $ref: "#/components/schemas/AxisBound" }
                hide_spanning:         { type: boolean, description: "Leave out the junctions whose two ends lie either side of the view." }
                display:               { type: string, enum: [features, sashimi], description: "A junction track only." }
              patternProperties:
                "^_": {}
              additionalProperties: false

    RequestCommand_set_sashimi_options:
      description: |
        Since 0.11.0. A Sashimi track's options, or a junction track's
        Sashimi display, all or nothing; the answer gives the options as
        they stand. On a Sashimi track min_mapq, min_overhang,
        include_supplementary and max_span count the window again when they
        change; the others change the drawing. On a junction track (the result of Splice
        Junctions) set_sashimi_options reads display, min_count, arc_scale,
        show_counts and hide_spanning alone, and refuses a Sashimi track's
        other keys by name.
      examples:
        - { command: set_sashimi_options, params: { name: "reads.bam Sashimi", arc_scale: width, show_counts: true } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: set_sashimi_options }
            params:
              type: object
              required: [name]
              properties:
                name: { type: string }
                min_mapq:              { type: integer, minimum: 0, maximum: 255 }
                min_overhang:          { type: integer, minimum: 1, maximum: 10000 }
                include_supplementary: { type: boolean }
                max_span:              { type: integer, minimum: 1000, maximum: 10000000, description: "Count up to: a wider view is not counted (2,000,000 bases by default)." }
                min_count:             { type: integer, minimum: 1, maximum: 1000000000, description: "Least reads: junctions below it are not drawn." }
                arc_scale:             { type: string, enum: [height, width] }
                shared_scale:          { type: boolean }
                show_counts:           { type: boolean }
                show_profile:          { type: boolean }
                profile_color:         { $ref: "#/components/schemas/Colour" }
                profile_opacity:       { type: number, minimum: 0, maximum: 1 }
                line_width:            { type: number, minimum: 0.5, maximum: 10 }
                scale:                 { $ref: "#/components/schemas/AxisScale" }
                auto_scale:            { type: boolean }
                y_min:                 { $ref: "#/components/schemas/AxisBound" }
                y_max:                 { $ref: "#/components/schemas/AxisBound" }
                hide_spanning:         { type: boolean, description: "Leave out the junctions whose two ends lie either side of the view." }
                display:               { type: string, enum: [features, sashimi], description: "A junction track only." }
              patternProperties:
                "^_": {}
              additionalProperties: false

    RequestCommand_add_overlay_track:
      description: Since 0.11.0. Overlays two or more signal, coverage or alignment tracks of one group in one lane, each in its own colour; the tracks stay as they are. Any key of set_overlay_options may be given. The answer names the overlay and its group and gives its options.
      examples:
        - { command: add_overlay_track, params: { tracks: [chip_rep1.bw, chip_rep2.bw], style: area, shared_scale: true } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: add_overlay_track }
            params:
              type: object
              required: [tracks]
              properties:
                tracks: { type: [array, string], items: { type: string }, description: "The tracks' names, as a list or separated by commas." }
                name:   { type: string, description: "The new track's name; default, Overlay: A + B." }
                shared_scale: { type: boolean, description: "One axis over every source (true) or each its own." }
                scale:        { $ref: "#/components/schemas/AxisScale" }
                auto_scale:   { type: boolean }
                y_min:        { $ref: "#/components/schemas/AxisBound" }
                y_max:        { $ref: "#/components/schemas/AxisBound" }
                style:        { type: string, enum: [line, area] }
                line_width:   { type: number, minimum: 0.5, maximum: 10 }
                key:          { type: boolean }
                colors:       { type: array, items: { $ref: "#/components/schemas/Colour" }, description: "One colour a source, in the sources' order." }
                opacities:    { type: array, items: { type: number, minimum: 0, maximum: 1 }, description: "One opacity a source." }
              patternProperties:
                "^_": {}
              additionalProperties: false

    RequestCommand_set_overlay_options:
      description: Since 0.11.0. An overlay's options, all or nothing; a key the command does not read is refused.
      examples:
        - { command: set_overlay_options, params: { name: "Overlay: chip_rep1.bw + chip_rep2.bw", shared_scale: false, opacities: [0.9, 0.6] } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: set_overlay_options }
            params:
              type: object
              required: [name]
              properties:
                name: { type: string }
                shared_scale: { type: boolean, description: "One axis over every source (true) or each its own." }
                scale:        { $ref: "#/components/schemas/AxisScale" }
                auto_scale:   { type: boolean }
                y_min:        { $ref: "#/components/schemas/AxisBound" }
                y_max:        { $ref: "#/components/schemas/AxisBound" }
                style:        { type: string, enum: [line, area] }
                line_width:   { type: number, minimum: 0.5, maximum: 10 }
                key:          { type: boolean }
                colors:       { type: array, items: { $ref: "#/components/schemas/Colour" }, description: "One colour a source, in the sources' order." }
                opacities:    { type: array, items: { type: number, minimum: 0, maximum: 1 }, description: "One opacity a source." }
              patternProperties:
                "^_": {}
              additionalProperties: false

    # Analysis
    RequestCommand_list_analyses:
      description: |
        The analyses the tracks given can take. Since 0.11.0 a name that is
        no track of the active group is refused (404 `TRACK_NOT_FOUND`) and
        so is a `tracks` that is not a list of names (400 `INVALID_PARAMS`).
        On a group whose reference is read as a transcriptome, the eight
        analyses meant for a genome (Splice Junctions, CNV Segmentation,
        Strand Bias, Simple Peak Calling, Enrichment Over Input, TAD
        Boundary Detection, Contact Matrix, Contact Frequency vs Distance)
        are left out of `analyses`, as the Run Analysis dialog leaves them
        out, and listed under `left_out_for_genome`, each with its `name`,
        `type` and `reason` (an empty list on any other group);
        `run_analysis` still runs one named.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: list_analyses }
            params:
              type: object
              properties:
                tracks:
                  type: [array, "null"]
                  items: { type: string }
                  description: Default (or null), the visible tracks.

    RequestCommand_run_analysis:
      description: |
        Starts one of the 59 analyses on a background thread and answers
        at once (`status` running); poll `analysis_status`. An unknown name
        answers 400 `UNKNOWN_ANALYSIS`; another analysis still running, 409
        `INVALID_STATE`; since 0.11.0 a name in `tracks` that is no track of
        the active group, 404 `TRACK_NOT_FOUND`, and a `tracks` that is not
        a list of names, 400 `INVALID_PARAMS`. Since 0.11.0 an analysis that
        needs the reference (GC Content, Nucleotide Frequency, CpG Density,
        Motif Search, Repeat Density, Mismatch Rate, Coding Impact, ORF
        Prediction) is refused before it starts in a group without one, 409
        `NO_REFERENCE`, naming the analysis and the group ("GC Content needs
        a reference, and the group 'custom' has none (No reference): load a
        FASTA into the group, or switch to a group that has one"). Every
        result file gets a manifest beside it (`<result>.manifest.json`).
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: run_analysis }
            params:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  description: "Analysis name (e.g. GCContent): see list_analyses for the full catalogue."
                tracks:
                  type: [array, "null"]
                  items: { type: string }
                  description: Input tracks in slot order (A, then B); default, the visible tracks fitted to the analysis's inputs.
                params:
                  type: object
                  description: |
                    Analysis-specific parameters, e.g. `{"window_size": "100"}`.
                    `scope`: `viewport` (the default unless Settings says
                    otherwise), `chromosome` (`transcript` is the same scope on a
                    transcriptome reference) or `genome` (`group` and `all` are
                    read as `genome`). `chromosome` with `start` and `end`
                    (0-based, end exclusive) names a region and wins over the
                    scope. `hash_inputs` true checksums every input file
                    whatever its size. Since 0.11.0 Differential Expression's
                    `condition_a` and `condition_b`, CNV Segmentation's,
                    Modification Sites' and Modification Co-occurrence's
                    `control`, and Poly(A) Statistics' `compare` name tracks of
                    the active group, which are added to the inputs (a name that
                    is no track: 404 `TRACK_NOT_FOUND`). A parameter that
                    does not parse or is out of range fails the analysis and
                    names itself; a parameter the analysis did not read is
                    named in `analysis_status`'s `parameters_unread`. A
                    parameter not named takes its default, the value
                    Settings > Analysis gives it where Settings has a row for
                    it. Some rules of 0.11.0 a client sees in the results:

                    - Simple Peak Calling, Feature Prominence, Coverage
                      Anomalies and Variant Density Hotspots take the
                      background (the cut-off) of a view's or a region's
                      chromosome, read whole, and list what of that
                      chromosome meets the view or the region, each whole (the
                      hotspots in the chromosome's windows from its first
                      base); a view costs what its chromosome costs. At genome
                      scope the one cut-off of Feature Prominence and Coverage
                      Anomalies leaves out the organelles' sequences (chrM,
                      MT, M, chrMT, Mito, a name holding mitochond; the
                      plastid's C, chrC, Pt, chrPt, a name holding chloroplast
                      or plastid), which are still listed, unless no other
                      sequence has a value. The summary's `background_from`
                      and `organelles_left_out` say what was read.
                    - With `count_fragments` (Feature Counts, RPKM, TPM, CPM;
                      Differential Expression counts fragments by default) a
                      read pair is counted once, as featureCounts -p
                      --countReadPairs counts it: each read meets genes by
                      `mode` on its own strand and votes, and the gene with
                      the most votes takes the fragment, a tie leaving it
                      ambiguous; a pair on two chromosomes is paired across
                      them (`fragments_two_references`); a pair is left out
                      when both reads are below the MAPQ floor, or when either
                      is a duplicate (with `ignore_duplicates`), has NH above 1
                      (without `count_multimapped`) or failed QC (with
                      `count_qc_failed` false); the whole BAM is read at any
                      scope, and `primary_only` false is taken.
                    - Modification Co-occurrence's `pair_test` is
                      `stratified` by default (a Cochran-Mantel-Haenszel test
                      over strata of each read's share of modified calls at
                      the reference's other candidate sites), or `fisher`.
                    - Contact Matrix's `apply_track_filters` is true by
                      default: it reads the contacts the input track's Min
                      score and Min distance keep (at their defaults, 0 and
                      0, every contact not scored below 0); false reads every
                      contact.
                    - ORF Prediction's result track holds at most
                      `track_cap` ORFs (100,000 by default; 0 keeps every
                      one), an equal share of each class: the cap is divided
                      equally among the classes with ORFs, a class with fewer
                      ORFs than its share keeps them all, and what it leaves
                      is divided equally among the others again. Places left
                      over go to the classes first in the order translon,
                      extension, internal_in_frame, uORF,
                      upstream_overlapping, dORF, downstream_overlapping,
                      internal_out_of_frame, non_coding, no_annotation,
                      unclassified (a cap below the number of classes with
                      ORFs gives one ORF to each of the first); within a class
                      the longer ORFs come first, ties broken by a hash of the
                      transcript and the ORF's place. The table and
                      `orfs_file` list every ORF; a capped track reads
                      `track_file` (summary `track_orfs`).
                    - TAD Boundary Detection, with no window named and every
                      chromosome too short for the default, takes a window of
                      a quarter of the longest chromosome, in bins of a tenth
                      of it, at least 10,000 bases (summary `fitted_window`).
                output_path: { type: string, description: "A relative path is under the results directory." }
                results_dir: { type: string, description: "The directory for this run's result files and manifest; a relative one is under the results directory." }

    RequestCommand_analysis_status:
      description: Since 0.11.0 answered 200 whatever the analysis's outcome (a failed one gives success false and its error), with `parameters_unread` for one that succeeded.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: analysis_status }
            params:  { type: object }

    RequestCommand_cancel_analysis:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: cancel_analysis }
            params:  { type: object }

    RequestCommand_read_result_rows:
      description: |
        The rows of a result file, read from its start to the end of the
        page, never whole; the answer comes when the page is read. It reads
        only a file an analysis wrote (its output, its manifest, a file its
        summary names), in this run or in the run that saved a session it
        reopens; any other path, a file in the results directory included,
        is refused with 403 `NOT_A_RESULT` before it is read.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: read_result_rows }
            params:
              type: object
              required: [path]
              properties:
                path:   { type: string, description: "The result file; a relative path is under the results directory." }
                offset: { type: integer, minimum: 0, default: 0, description: "The first row to give, counted from 0." }
                limit:  { type: integer, minimum: 1, maximum: 1000, default: 100 }

    # Video recording
    RequestCommand_start_recording:
      description: Each key not given takes Settings > Output > Capture's value, and nothing is written back to Settings. A value out of range is refused by name. Without ffmpeg, 500 DEPENDENCY_MISSING.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: start_recording }
            params:
              type: object
              properties:
                format:       { type: string, enum: [mp4, webm, gif] }
                fps:          { type: integer, minimum: 1, maximum: 240 }
                capture_mode: { type: string, enum: [timer, render] }
                quality:      { type: integer, minimum: 0, maximum: 51, description: "The CRF: 0 lossless, 23 the usual default, 51 the lowest." }
                output_path:  { type: string, description: "The directory for the video file." }

    RequestCommand_stop_recording:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: stop_recording }
            params:  { type: object }

    RequestCommand_recording_status:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: recording_status }
            params:  { type: object }

    # Sessions and the process
    RequestCommand_save_session:
      description: Since 0.11.0 a session also keeps each group's reference mode and edit log, each bookmark's group, and the open Known Features tabs.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: save_session }
            params:
              type: object
              required: [path]
              properties:
                path: { type: string, description: "The .vxs file to write (.vxs is appended when missing; a relative path is under the Sessions directory)." }

    RequestCommand_load_session:
      description: |
        Restores a session without a dialog: a missing input file is
        skipped and named in `inputs_missing`. The files load in the
        background (`loading_status`, `/state`).
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: load_session }
            params:
              type: object
              required: [path]
              properties:
                path: { type: string, description: "The .vxs file (a relative path is under the Sessions directory)." }

    RequestCommand_shutdown:
      description: The viewer answers, then closes its window (or, without a window, quits); the process has ended 5 s after the answer at the latest.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: shutdown }
            params:  { type: object }

    # Demo data
    RequestCommand_load_demo:
      description: |
        Opens a demo case: downloaded once into the cache from the
        `demo-data-v1` release (or the address set in Settings > Paths or
        `VX_DEMO_BASE_URL`), checked, loaded, and shown at its figure's
        view. Answers at once; poll `loading_status`. An unknown case is 400
        `INVALID_PARAMS`; another case still being opened, 409 `BUSY`; an
        address that is not http or https, 409 `INVALID_STATE`. Since
        0.11.0 case `builtin` makes the built-in demo again (its files
        checked, written again when one is missing or differs) and answers
        when it is made, without holding the window; when its two groups
        are open already, it keeps them as they are and answers at once
        with `made` false.
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: load_demo }
            params:
              type: object
              required: [case]
              properties:
                case:     { type: [string, integer], description: "1, 2, 3a, 3b or 4, or builtin." }
                navigate: { type: boolean, default: true, description: "Go to the figure's view once the files are loaded." }

    RequestCommand_demo_status:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: demo_status }
            params:  { type: object }

    # Known Features (since 0.11.0). A tab is named by its key (as
    # known_features answers it) or by the identifier it was opened with; a
    # name no open tab has is 404 TAB_NOT_FOUND. A key the command does not
    # read, or a bad value, is 400 INVALID_PARAMS.
    RequestCommand_known_features:
      description: |
        Since 0.11.0. Opens (or shows) the Known Features tab of a gene,
        transcript or protein; it fills in the background from the public
        services turned on in Settings > Known Features. The answer gives
        `tab` (its key), `opened` (false when it was open already) and
        `state` (queued, fetching, done, cancelled). With 32 tabs open, 409
        `BUSY`.
      examples:
        - { command: known_features, params: { id: ENSG00000141510 } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: known_features }
            params:
              type: object
              required: [id]
              properties:
                id:      { type: string, maxLength: 64, description: "An Ensembl gene, transcript or protein ID, a yeast systematic name, a FlyBase or WormBase gene ID, a UniProt accession, a RefSeq transcript or protein, an NCBI Gene ID, an HGNC ID, or a gene's name." }
                species: { type: string, description: "A species in Ensembl's form, such as homo_sapiens (a gene's name is looked up in it)." }
                kind:    { type: string, enum: [gene, transcript, protein, uniprot, refseq_transcript, refseq_protein, ncbi_gene, hgnc, symbol], description: "symbol reads an ID-like text as a gene's name; another kind must be the one the text has." }
                label:   { type: string, maxLength: 64, description: "The tab's name." }
                refresh: { type: boolean, description: "true asks every service again." }
              additionalProperties: false

    RequestCommand_known_features_status:
      description: Since 0.11.0. With `id`, that tab whole (its sections, sources and status line); without, every tab in short with the options.
      examples:
        - { command: known_features_status, params: {} }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: known_features_status }
            params:
              type: object
              properties:
                id: { type: string }
              additionalProperties: false

    RequestCommand_close_known_features:
      description: Since 0.11.0. Closes a tab (`id`), or every tab (`all` true, given alone); the answer gives `closed`, how many.
      examples:
        - { command: close_known_features, params: { all: true } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: close_known_features }
            params:
              oneOf:
                - type: object
                  required: [id]
                  properties:
                    id: { type: string }
                  additionalProperties: false
                - type: object
                  required: [all]
                  properties:
                    all: { type: boolean, const: true }
                  additionalProperties: false

    RequestCommand_export_known_features:
      description: Since 0.11.0. Writes a tab as Markdown or JSON (the JSON also holds the structure's alpha-carbon coordinates); a relative path is under the results directory.
      examples:
        - { command: export_known_features, params: { id: ENSG00000141510, path: /tmp/tp53.md } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: export_known_features }
            params:
              type: object
              required: [id, path]
              properties:
                id:     { type: string }
                path:   { type: string }
                format: { type: string, enum: [markdown, md, json], description: "Default: by the path's extension (.md or .markdown, .json)." }
              additionalProperties: false

    RequestCommand_set_known_features_options:
      description: Since 0.11.0. Settings > Known Features, every value checked before any is applied; the answer gives the options.
      examples:
        - { command: set_known_features_options, params: { enabled: { intact: true }, interactions: 15, cache_only: false } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: set_known_features_options }
            params:
              type: object
              properties:
                sources:      { type: array, minItems: 6, maxItems: 6, uniqueItems: true, items: { type: string, enum: [ensembl, uniprot, string, intact, pdb, ncbi] }, description: "All six services, in their new order (the first that names an element gives the tab's name and description)." }
                enabled:      { type: object, description: "Each service's key to true or false.", propertyNames: { enum: [ensembl, uniprot, string, intact, pdb, ncbi] }, additionalProperties: { type: boolean } }
                species:      { type: string, description: "Ensembl's form, such as homo_sapiens." }
                interactions: { type: integer, minimum: 1, maximum: 50, description: "The partners shown (10 by default)." }
                cache_days:   { type: integer, minimum: 0, maximum: 365, description: "The days an answer is kept (7 by default)." }
                cache_only:   { type: boolean, description: "Read the cache alone: no request at all." }
              additionalProperties: false

    # Edit mode (since 0.11.0). Each command edits the active group's
    # reference or annotation through its edit log. Positions are 0-based,
    # the end excluded (the log writes them 1-based, as the ruler does). A
    # request is checked whole before anything changes: a key the command
    # does not read, a missing or ill-typed value, a position outside the
    # sequence, a strand other than +, - or ., a name holding a tab, a line
    # break, a double quote, a semicolon or an equals sign (or longer than
    # 255 characters), bases other than IUPAC letters or more than
    # 10,000,000 bases at once: 400 INVALID_PARAMS naming the key. A track,
    # gene, transcript, exon or feature the group does not hold: 404
    # TRACK_NOT_FOUND or FEATURE_NOT_FOUND; a sequence the reference does not
    # hold: 404 NOT_FOUND; an annotation above 50 MiB read through its index:
    # 400 NOT_SUPPORTED; nothing to undo or redo: 409 INVALID_STATE; no
    # reference: 409 NO_REFERENCE. Every command but edit_list is refused
    # while an analysis runs (409 BUSY) or a file loads (409 LOADING). A gene
    # is its ID on one sequence: `chromosome` (and, for a transcript or an
    # exon, `gene_id`) names one copy of an ID that two sequences, or two
    # genes of one sequence, carry, and `gene_start` one of the copies of an
    # ID on one sequence by its present start (0-based, as get_genes gives
    # it); a start where no copy lies is 404 FEATURE_NOT_FOUND, and where the
    # keys given leave several, 400 INVALID_PARAMS names the key to give.
    # Every answer gives `log` (its length and the position of Undo).
    RequestCommand_edit_add_gene:
      description: Adds a gene with one transcript of one exon over [start, end). Its ID defaults to the next free VXEDIT number, its name to its ID, its biotype to protein_coding, its transcript's ID to the gene's with -T1, its strand to +. The answer gives the gene.
      examples:
        - { command: edit_add_gene, params: { chromosome: chr1, start: 10000, end: 12000, strand: "-", name: MYGENE } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: edit_add_gene }
            params:
              type: object
              required: [chromosome, start, end]
              properties:
                track:         { type: string }
                chromosome:    { type: string }
                start:         { type: integer, minimum: 0 }
                end:           { type: integer, minimum: 1 }
                strand:        { type: string, enum: ["+", "-", "."] }
                gene_id:       { type: string }
                name:          { type: string }
                biotype:       { type: string }
                transcript_id: { type: string }
              additionalProperties: false

    RequestCommand_edit_add_transcript:
      description: Adds a transcript to a gene, from its exons ([start, end) pairs) and, for a coding one, its translon ([start, end)). The transcript is put in order (exons numbered in the order of transcription, phases by GTF's rule).
      examples:
        - { command: edit_add_transcript, params: { gene_id: VXEDIT1, exons: [[10000, 10400], [11000, 12000]], translon: [10100, 11500] } }
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            command: { type: string, const: edit_add_transcript }
            params:
              type: object
              required: [gene_id, exons]
              properties:
                track:         { type: string }
