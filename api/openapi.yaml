    name: MIT
    identifier: MIT
  contact:
    name: VX
    url: https://github.com/Arnaroo/VX

servers:
  - url: http://127.0.0.1:9876
    description: Default local bind

tags:
  - name: meta
    description: Liveness and state introspection
  - name: capture
    description: PNG screenshot endpoints
  - name: navigation
    description: Viewport navigation, zoom, pan

paths:
  /ping:
    get:
      tags: [meta]
      operationId: ping
      summary: Liveness check.
      responses:
        "200":
          description: VX is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"
              example:
                status: ok
                app: VX
                api_version: 2
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /state:
    get:
      tags: [meta]
      operationId: getState
      summary: Full snapshot of VX state.
      description: |
        Returns the view, the loaded groups, tracks and chromosomes, the
        current configuration and what the last session restore did. Use
        this to discover available track and group names for other commands.
      responses:
        "200":
          description: Current VX state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/NotReady"
        "504":
          $ref: "#/components/responses/Timeout"

  /screenshot:
    get:
      tags: [capture]
      operationId: screenshotFull
      summary: PNG of the entire VX window, rendered.
      description: |
        Draws the whole window (toolbar, panels and the track area) into an
        image at the scale asked for; nothing is read from the screen. The
        track area in it is what the window's OpenGL area last drew.
      parameters:
        - $ref: "#/components/parameters/ScaleQuery"
      responses:
        "200":
          description: PNG image (RGB, no alpha channel).
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/NotReady"
        "504":
          $ref: "#/components/responses/Timeout"

  /screenshot/full:
    get:
      tags: [capture]
      operationId: screenshotFullAlias
      summary: Alias for `/screenshot`.
      parameters:
        - $ref: "#/components/parameters/ScaleQuery"
      responses:
        "200":
          description: PNG image (RGB, no alpha channel).
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/NotReady"
        "504":
          $ref: "#/components/responses/Timeout"

  /screenshot/viewport:
    get:
      tags: [capture]
      operationId: screenshotViewport
      summary: PNG of the track area alone (no window controls).
      description: |
        Renders the track area off screen at the scale asked for. A viewer
        without an OpenGL context (as without a display) answers 503
        `NO_RENDER` with the reason in `details`.
      parameters:
        - $ref: "#/components/parameters/ScaleQuery"
      responses:
        "200":
          description: PNG image (RGB, no alpha channel).
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/NotReady"
        "504":
          $ref: "#/components/responses/Timeout"

  /screenshot/track:
    get:
      tags: [capture]
      operationId: screenshotTrack
      summary: PNG of a single track including its label area.
      description: |
        Renders one visible track whole, wherever it sits in the track area.
        The name is percent-decoded (`%20` and `+` are spaces).
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
          description: Track name (as listed in `/state` `tracks[].name`).
        - $ref: "#/components/parameters/ScaleQuery"
      responses:
        "200":
          description: PNG image (RGB, no alpha channel).
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotReady"
        "504":
          $ref: "#/components/responses/Timeout"

  /navigate:
    post:
      tags: [navigation]
      operationId: navigateLegacy
      summary: Direct navigation endpoint.
      description: |
        Navigates to a region, as `POST /command` with `command: "navigate"`
        does, and answers `{"success": true}`. A chromosome that is not in
        the loaded reference, or an empty range, answers 400
        `INVALID_PARAMS` here (`navigate` through `/command` answers 404
        `NOT_FOUND` for an unknown chromosome). The MCP tool `vx_navigate`
        uses this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NavigateLegacyRequest"
      responses:
        "200":
          description: Navigation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/NotReady"
        "504":
          $ref: "#/components/responses/Timeout"

  /command:
    post:
      tags: [meta]
      operationId: runCommand
      summary: Dispatch a named command.
      description: |
        Single entry point for the majority of VX functionality. The
        request body is `{ "command": "<name>", "params": { ... } }`; the
        91 commands are listed in this document's description.

        Every documented `RequestCommand_*` schema in `#/components` can
        be POSTed here verbatim; the `command` field is the discriminator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/RequestCommand_load_file"
                - $ref: "#/components/schemas/RequestCommand_set_track_visibility"
                - $ref: "#/components/schemas/RequestCommand_set_track_height"
                - $ref: "#/components/schemas/RequestCommand_set_track_scroll"
                - $ref: "#/components/schemas/RequestCommand_remove_track"
                - $ref: "#/components/schemas/RequestCommand_reorder_track"
                - $ref: "#/components/schemas/RequestCommand_create_group"
                - $ref: "#/components/schemas/RequestCommand_switch_group"
                - $ref: "#/components/schemas/RequestCommand_remove_group"
                - $ref: "#/components/schemas/RequestCommand_set_reference_mode"
                - $ref: "#/components/schemas/RequestCommand_navigate"
                - $ref: "#/components/schemas/RequestCommand_zoom"
                - $ref: "#/components/schemas/RequestCommand_pan"
                - $ref: "#/components/schemas/RequestCommand_next_coverage_region"
                - $ref: "#/components/schemas/RequestCommand_cancel_coverage_scan"
                - $ref: "#/components/schemas/RequestCommand_get_sequence"
                - $ref: "#/components/schemas/RequestCommand_get_genes"
                - $ref: "#/components/schemas/RequestCommand_search_genes"
                - $ref: "#/components/schemas/RequestCommand_set_config"
                - $ref: "#/components/schemas/RequestCommand_set_magnifier"
                - $ref: "#/components/schemas/RequestCommand_select_region"
                - $ref: "#/components/schemas/RequestCommand_click_element"
                - $ref: "#/components/schemas/RequestCommand_export_region"
                - $ref: "#/components/schemas/RequestCommand_export_svg"
                - $ref: "#/components/schemas/RequestCommand_export_image"
                - $ref: "#/components/schemas/RequestCommand_svg_export_status"
                - $ref: "#/components/schemas/RequestCommand_loading_status"
                - $ref: "#/components/schemas/RequestCommand_cancel_loading"
                - $ref: "#/components/schemas/RequestCommand_add_bookmark"
                - $ref: "#/components/schemas/RequestCommand_list_bookmarks"
                - $ref: "#/components/schemas/RequestCommand_remove_bookmark"
                - $ref: "#/components/schemas/RequestCommand_goto_bookmark"
                - $ref: "#/components/schemas/RequestCommand_list_chromosomes"
                - $ref: "#/components/schemas/RequestCommand_set_signal_options"
                - $ref: "#/components/schemas/RequestCommand_set_variant_options"
                - $ref: "#/components/schemas/RequestCommand_set_interaction_options"
