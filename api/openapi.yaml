openapi: 3.1.0
info:
  title: "VX: HTTP API"
  version: "2.0"
  summary: Localhost HTTP API for driving VX.
  description: |
    VX runs an embedded HTTP server on `127.0.0.1:9876` for external tool
    integration (e.g. the Claude MCP server in `../mcp/vx_mcp_server.py`).
    The port is set in Settings > MCP / API, or with `--port N` on the
    command line. This document describes the API as VX 0.11.0 serves it
    (`GET /ping` answers `"api_version":2`).

    The API's endpoints:

      * `GET  /ping`:                  liveness check
      * `GET  /state`:                 full state snapshot
      * `GET  /screenshot[/...]`:      PNG capture (full window / viewport / single track)
      * `POST /navigate`:              direct navigation (the MCP tool `vx_navigate` uses it)
      * `POST /command`:               generic dispatch entry point for all other actions

    Nearly all functionality goes through `POST /command`. Each request body
    is `{ "command": "<name>", "params": { ... } }` and the response is
    JSON shaped by the command (see the `RequestCommand_*` and
    `Response_*` schemas in `#/components`). Positions are 0-based with
    the end excluded unless a key says otherwise.

    ## Commands (91)

    - **File loading:** `load_file`
    - **Track management:** `set_track_visibility`, `set_track_height`,
      `set_track_scroll`, `remove_track`, `reorder_track`
    - **Group management:** `create_group`, `switch_group`, `remove_group`,
      `set_reference_mode`
    - **Navigation:** `navigate`, `zoom`, `pan`, `next_coverage_region`,
      `cancel_coverage_scan`
    - **Data queries:** `get_sequence`, `get_genes`, `search_genes`
    - **Config:** `set_config`, `set_magnifier`
    - **Selection:** `select_region`, `click_element`
    - **Export:** `export_region`, `export_svg`, `export_image`,
      `svg_export_status`
    - **Loading state:** `loading_status`, `cancel_loading`
    - **Bookmarks:** `add_bookmark`, `list_bookmarks`, `remove_bookmark`,
      `goto_bookmark`
    - **Chromosomes:** `list_chromosomes`
    - **Track options:** `set_track_options`, `set_coverage_options`,
      `set_signal_options`, `set_variant_options`, `set_interaction_options`,
      `set_sequence_options`, `set_gene_options`, `set_feature_options`,
      `set_alignment_options`
    - **Read aggregates and transcript DTI:** `add_aggregate_track`,
      `set_aggregate_options`, `aggregate_rows`, `add_dti_track`,
      `set_dti_options`, `dti_lookup`
    - **Sashimi and overlay tracks:** `add_sashimi_track`,
      `set_sashimi_options`, `add_overlay_track`, `set_overlay_options`
    - **Analysis:** `list_analyses`, `run_analysis`, `analysis_status`,
      `cancel_analysis`, `read_result_rows`
    - **Recording:** `start_recording`, `stop_recording`, `recording_status`
    - **Sessions and the process:** `save_session`, `load_session`, `shutdown`
    - **Demo data:** `load_demo`, `demo_status`
    - **Known Features:** `known_features`, `known_features_status`,
      `close_known_features`, `export_known_features`,
      `set_known_features_options`
    - **Edit mode:** `edit_add_gene`, `edit_add_transcript`, `edit_add_exon`,
      `edit_add_feature`, `edit_move`, `edit_resize`, `edit_delete`,
      `edit_rename`, `edit_set_strand`, `edit_set_biotype`,
      `edit_insert_bases`, `edit_delete_bases`, `edit_replace_bases`,
      `edit_undo`, `edit_redo`, `edit_list`, `edit_write`, `edit_discard`
    - **Circular view and dot plot:** `open_circular_view`,
      `export_circular_view`, `dot_plot`

    New in 0.11.0 (36 of them): `set_reference_mode`;
    `set_track_options`, `set_coverage_options`, `set_sequence_options`,
    `set_gene_options` and `set_feature_options`; the Sashimi and overlay
    commands; the Known Features commands; the Edit mode's commands; the
    circular view and dot plot commands.

    ## Answers that come when the work ends

    Six commands answer when their work ends, not at once:
    `next_coverage_region` (when its scan ends, which on a whole
    chromosome of a large BAM can take a minute or more),
    `aggregate_rows` (when its rows are counted), `read_result_rows` (when
    its page is read), `load_demo` with case `builtin` (when the built-in
    demo is made), `export_circular_view` and `dot_plot` (when the file is
    written). Their work runs beside the window, which goes on drawing and
    answering other requests; the API's timeout does not bound them, so
    give them no short client timeout.

    ## Security model

    The server binds to `127.0.0.1` only, has no authentication, and is
    intended for same-machine use. Since 0.11.0 it refuses, with 403
    `FORBIDDEN_ORIGIN` and before any command runs, a request that a web
    browser sends for a page: one whose head carries an `Origin` header
    (whatever its value), one whose `Host` header names a host other than
    `127.0.0.1`, `localhost` or `[::1]` (any port; a request without
    `Host` is taken), and one whose `Sec-Fetch-Site` header is anything but
    `none`. Scripts, `curl` and the MCP server send none of these, and no
    `Content-Type` is required. The server sends no CORS headers and
    answers `OPTIONS` with 405. A request head that does not end within
    64 KiB or 10 s is answered 400 `PARSE_ERROR`. For remote access,
    tunnel over SSH: `ssh -L 9876:127.0.0.1:9876 user@host`.

    ## Error model

    Failed requests return a JSON body with:

      * `error`:    human-readable message
      * `code`:     machine-readable code (`ErrorBody` lists them)
      * `details`:  optional remediation hint

    The HTTP status follows the code (a success is 200): 400 for
    `INVALID_PARAMS`, `PARSE_ERROR`, `UNKNOWN_ANALYSIS` and
    `NOT_SUPPORTED`; 403 for `NOT_A_RESULT` and `FORBIDDEN_ORIGIN`; 404 for
    `UNKNOWN_COMMAND`, `UNKNOWN_ENDPOINT`, `NOT_FOUND` and any code ending
    in `_NOT_FOUND` (`TRACK_NOT_FOUND`, `FEATURE_NOT_FOUND`,
    `CHROMOSOME_NOT_FOUND`, `GENE_NOT_FOUND`, `TAB_NOT_FOUND`); 405 for
    `METHOD_NOT_ALLOWED`; 409 for `BUSY`, `LOADING`, `INVALID_STATE`,
    `NO_REFERENCE` and `NO_ANNOTATION`; 501 for `NOT_IMPLEMENTED`; 503 for
    `NOT_READY` and `NO_RENDER`; 504 for `TIMEOUT` and `STALLED`; 500 for
    `OPERATION_FAILED`, `IO_ERROR`, `WRITE_FAILED`, `DEPENDENCY_MISSING`,
    `INTERNAL_ERROR` and an error without a code. Since 0.11.0 a report
    command (`analysis_status`, `loading_status`, `demo_status`,
    `recording_status`, `svg_export_status`) whose answer gives the
    failure of its work as an `error` without a `code` (an analysis that
    failed, say) answers 200: the status request itself succeeded.

    Each request gets its own answer. The window's answer is awaited for the
    API timeout (Settings > Appearance > Performance, 30 s by default); past
    it the request is answered 504 `TIMEOUT`, may still be carried out, and
    its late answer is dropped and named in VX's log.
