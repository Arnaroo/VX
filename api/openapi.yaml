                gene_start:    { type: integer, minimum: 0, description: "A gene's, transcript's or exon's: the present start (0-based, as get_genes gives it) of one of the copies of the gene's ID on one sequence." }
                start:         { type: integer, minimum: 0, description: "A feature's start (required)." }
                end:           { type: integer, minimum: 0, description: "A feature's end (required)." }
                name:          { type: string, description: "A feature's name, when two features share its span." }
