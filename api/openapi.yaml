                - $ref: "#/components/schemas/RequestCommand_aggregate_rows"
                - $ref: "#/components/schemas/RequestCommand_add_dti_track"
                - $ref: "#/components/schemas/RequestCommand_set_dti_options"
                - $ref: "#/components/schemas/RequestCommand_dti_lookup"
                - $ref: "#/components/schemas/RequestCommand_add_sashimi_track"
